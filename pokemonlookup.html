<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Pokémon Look Up - DBA Megastats</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="layout.css">

  <script src="shared.js"></script>
  <script src="api.js"></script>
</head>

<body class="centered page-pokemon-lookup">

  <main class="pokemon-lookup">

    <h2>Pokémon Look Up</h2>

    <div class="controls pokemon-lookup-controls">
      <div>
        <select id="pokemonSel">
          <option>Loading...</option>
        </select>
      </div>
    </div>

    <section id="pokemonDetails" hidden>

      <div class="pokemon-lookup-header">

        <h1 id="pokemonName"></h1>

        <img
          id="pokemonSprite"
          class="pokemon-lookup-sprite"
          alt=""
        >

        <div
          id="legality"
          class="pokemon-legality"
          aria-label="Pokémon legality"
        ></div>

        <div
          id="championships"
          class="pokemon-championships"
          aria-label="Championships"
        ></div>

      </div>


      <!-- =========================================================
           Draft History
           ========================================================= -->

      <section class="pokemon-section">

        <h3>Draft History</h3>

        <div class="wrap">

          <table class="nosort pokemon-draft-table">

            <thead>
              <tr>
                <th>Player Name</th>
                <th>Season</th>
                <th>Appearances</th>
                <th>K-D</th>
                <th>WR.</th>
                <th>Tera</th>
              </tr>
            </thead>

            <tbody id="draftBody"></tbody>

          </table>

        </div>

      </section>

      <!-- =========================================================
     Commonly Drafted With
     ========================================================= -->

<section
  class="pokemon-section"
  id="commonPartnersSection"
  hidden
>

  <h3>Commonly Drafted With</h3>

  <div class="wrap">

    <table class="nosort pokemon-partners-table">

      <thead>
        <tr>
          <th>Pokémon</th>
          <th>Sprite</th>
          <th>Partnered</th>
          <th>Users</th>
        </tr>
      </thead>

      <tbody id="commonPartnersBody"></tbody>

    </table>

  </div>

</section>



      <!-- =========================================================
           Overall Record
           ========================================================= -->

      <section class="pokemon-section">

        <h3>Overall Record</h3>

        <p class="pokemon-record-note">
          Gen 9 Season Stats
        </p>

        <div class="wrap">

          <div class="pokemon-record-tabs">

          <button
            type="button"
            id="regularRecordTab"
            class="pokemon-record-tab active"
          >
            Regular
          </button>

          <button
            type="button"
            id="teraRecordTab"
            class="pokemon-record-tab"
          >
            Tera
          </button>

        </div>

          <table class="nosort totals pokemon-record-table">

            <thead>
              <tr>
                <th>TD.</th>
                <th>GP.</th>
                <th>Kills</th>
                <th>Deaths</th>
                <th>Diff.</th>
                <th>Wins</th>
                <th>Losses</th>
                <th>WR.</th>
                <th>KPG.</th>
                <th>SR.</th>
              </tr>
            </thead>

            <tbody id="recordBody"></tbody>

          </table>

        </div>

      </section>

    </section>

  </main>


  <script>

    const pokemonSel =
      DBA.$('pokemonSel');

        const detailsEl =
      DBA.$('pokemonDetails');

    const pokemonNameEl =
      DBA.$('pokemonName');

    const pokemonSpriteEl =
      DBA.$('pokemonSprite');

    const championshipsEl =
      DBA.$('championships');

    const legalityEl =
      DBA.$('legality');

    const draftBody =
      DBA.$('draftBody');

    const recordBody =
      DBA.$('recordBody');

    const regularRecordTab =
      DBA.$('regularRecordTab');

    const teraRecordTab =
      DBA.$('teraRecordTab');

    const commonPartnersSection =
      DBA.$('commonPartnersSection');

    const commonPartnersBody =
      DBA.$('commonPartnersBody');

    let pokemonData = [];

    let selectedRecordType =
      'regular';

    let selectedPokemon =
      null;


    /*
     * ------------------------------------------------------------
     * Add a table cell
     * ------------------------------------------------------------
     */

    function addCell(row, value, className) {

      const cell =
        document.createElement('td');

      cell.textContent =
        value === null ||
        value === undefined ||
        value === ''
          ? '–'
          : value;

      if (className) {
        cell.className =
          className;
      }

      row.appendChild(cell);

      return cell;

    }


    /*
     * ------------------------------------------------------------
     * Draw Overall Record
     * ------------------------------------------------------------
     */

    function drawRecord(record) {

      recordBody.innerHTML = '';


      if (!record) {

        const row =
          recordBody.insertRow();

        const cell =
          row.insertCell();

        cell.colSpan =
          10;

        cell.textContent =
          'No overall record found.';

        return;

      }


      const row =
        recordBody.insertRow();


      addCell(
        row,
        record.td,
        'num'
      );


      addCell(
        row,
        record.gp,
        'num'
      );


      addCell(
        row,
        record.kills,
        'num'
      );


      addCell(
        row,
        record.deaths,
        'num'
      );


      addCell(
        row,
        record.diff,
        'num'
      );


      addCell(
        row,
        record.wins,
        'num'
      );


      addCell(
        row,
        record.losses,
        'num'
      );


      addCell(
        row,
        record.wr,
        'num'
      );


      addCell(
        row,
        record.kpg,
        'num'
      );


      addCell(
        row,
        record.sr,
        'num'
      );

    }


    /*
     * ------------------------------------------------------------
     * Update Overall Record Tab
     * ------------------------------------------------------------
     */

    function updateRecordTab() {

      if (!selectedPokemon) {

        recordBody.innerHTML =
          '';

        return;

      }


      const record =
        selectedRecordType === 'tera'
          ? selectedPokemon.teraRecord
          : selectedPokemon.record;


      drawRecord(record);


      regularRecordTab.classList.toggle(
        'active',
        selectedRecordType === 'regular'
      );


      teraRecordTab.classList.toggle(
        'active',
        selectedRecordType === 'tera'
      );

    }


    /*
     * ------------------------------------------------------------
     * Record Tab Buttons
     * ------------------------------------------------------------
     */

    regularRecordTab.onclick =
      () => {

        selectedRecordType =
          'regular';

        updateRecordTab();

      };


    teraRecordTab.onclick =
      () => {

        selectedRecordType =
          'tera';

        updateRecordTab();

      };


    /*
     * ------------------------------------------------------------
     * Display selected Pokémon
     * ------------------------------------------------------------
     */

    function showPokemon(pokemon) {

      console.log(
        'POKEMON OBJECT:',
        pokemon
      );


      if (!pokemon) {

        selectedPokemon =
          null;

        detailsEl.hidden =
          true;

        recordBody.innerHTML =
          '';

        return;

      }


      selectedPokemon =
        pokemon;

      selectedRecordType =
        'regular';


      detailsEl.hidden =
        false;

      
      /*
       * ----------------------------------------------------------
       * Header
       * ----------------------------------------------------------
       */

      pokemonNameEl.textContent =
        pokemon.name;


      pokemonSpriteEl.src =
        pokemon.sprite || '';


      pokemonSpriteEl.alt =
        pokemon.name;


      pokemonSpriteEl.style.display =
        pokemon.sprite
          ? 'block'
          : 'none';


      /*
       * ----------------------------------------------------------
       * Legality
       * ----------------------------------------------------------
       */

      legalityEl.innerHTML =
        '';


      const legalItem =
        document.createElement('div');


      legalItem.textContent =
        `Legal: ${pokemon.legal} of ${pokemon.totalSeasons} seasons`;


      legalityEl.appendChild(
        legalItem
      );


      /*
       * Mega Pokémon do not need a Tera Banned line.
       */

     if (
!pokemon.name.includes('-Mega')
) {

const teraBannedItem =
document.createElement('div');

const teraBanned =
Number(pokemon.teraBanned) || 0;

const teraBannedText =
teraBanned === 0
? 'Never'
: ${teraBanned} ${teraBanned === 1 ? 'time' : 'times'};

teraBannedItem.textContent =
Tera Banned: ${teraBannedText};

legalityEl.appendChild(
teraBannedItem
);

}


      /*
       * ----------------------------------------------------------
       * Championships
       * ----------------------------------------------------------
       */

    championshipsEl.innerHTML = '';

const championships =
  Array.isArray(pokemon.championships)
    ? pokemon.championships
    : [];

/*
 * Only display the championship container when
 * the Pokémon actually has one or more trophies.
 */
championshipsEl.style.display =
  championships.length
    ? 'flex'
    : 'none';

if (championships.length) {

  // One row containing every trophy
  const trophyRow = document.createElement('div');
  trophyRow.className = 'pokemon-trophy-row';

  // One line per winner underneath
  const winnerList = document.createElement('div');
  winnerList.className = 'pokemon-winner-list';

  championships.forEach(championship => {

    const trophy = document.createElement('span');
    trophy.className = 'pokemon-trophy';
    trophy.textContent = '🏆';
    trophyRow.appendChild(trophy);

    const teraText = championship.tera ? ' — Tera' : '';

    const winner = document.createElement('div');
    winner.className = 'pokemon-winner';
    winner.textContent =
      `${championship.player} - Season ${championship.season} (${championship.division})${teraText}`;
    winnerList.appendChild(winner);

  });

  championshipsEl.appendChild(trophyRow);
  championshipsEl.appendChild(winnerList);

}

      /*
       * ----------------------------------------------------------
       * Draft History
       * ----------------------------------------------------------
       */

      draftBody.innerHTML =
        '';


      const drafts =
        Array.isArray(
          pokemon.drafts
        )
          ? pokemon.drafts
          : [];


      if (
        drafts.length === 0
      ) {

        const row =
          draftBody.insertRow();


        const cell =
          row.insertCell();


        cell.colSpan =
          6;


        cell.textContent =
          'No draft history found.';

      } else {

        drafts.forEach(
          draft => {

            const row =
              draftBody.insertRow();


            /*
             * Player
             */

            addCell(
              row,
              draft.player
            );


            /*
             * Season
             */

            const seasonText =
              draft.season
                ? `Season ${draft.season} (${draft.division})`
                : `(${draft.division})`;


            addCell(
              row,
              seasonText
            );


            /*
             * Appearances
             */

            addCell(
              row,
              draft.appearances,
              'num'
            );


            /*
             * K-D
             */

            addCell(
              row,
              draft.kd,
              'num'
            );


            /*
             * WR.
             */

            addCell(
              row,
              draft.wr,
              'num'
            );


            /*
             * Tera
             */

            addCell(
              row,
              draft.tera
                ? 'Tera'
                : ''
            );

          }
        );

      }
/*
 * ----------------------------------------------------------
 * Commonly Drafted With
 * ----------------------------------------------------------
 */

commonPartnersBody.innerHTML =
  '';


const commonPartners =
  Array.isArray(
    pokemon.commonPartners
  )
    ? pokemon.commonPartners
    : [];


if (
  commonPartners.length === 0
) {

  commonPartnersSection.hidden =
    true;

} else {

  commonPartnersSection.hidden =
    false;


  commonPartners.forEach(
    partner => {

      const row =
        commonPartnersBody.insertRow();


      /*
       * Pokémon
       */

      addCell(
        row,
        partner.name
      );


      /*
       * Sprite
       */

      const spriteCell =
        row.insertCell();


      const sprite =
        document.createElement('img');


      sprite.src =
        partner.sprite || '';

      sprite.alt =
        partner.name;

      sprite.loading =
        'lazy';


      if (!partner.sprite) {
        sprite.style.display =
          'none';
      }


      spriteCell.appendChild(
        sprite
      );


      /*
       * Number of partnerships
       */

      const count =
        Number(partner.count) || 0;


      addCell(
        row,
        `${count} ${count === 1 ? 'Time' : 'Times'}`,
        'num'
      );


      /*
       * Users
       */

      const users =
        Array.isArray(partner.users)
          ? partner.users
          : [];


      let usersText = '';


      if (users.length === 1) {

        usersText =
          users[0];

      } else if (users.length === 2) {

        usersText =
          `${users[0]} and ${users[1]}`;

      } else if (users.length > 2) {

        usersText =
          `${users.slice(0, -1).join(', ')} and ${users[users.length - 1]}`;

      }


      addCell(
        row,
        usersText
      );

    }
  );

}

      /*
       * ----------------------------------------------------------
       * Tera Record Tab
       * ----------------------------------------------------------
       *
       * Only show the Tera tab when this Pokémon has actually
       * been drafted as a Tera Pokémon.
       */

      const hasTeraDraft =
        drafts.some(
          draft => draft.tera === true
        );


      teraRecordTab.style.display =
        hasTeraDraft
          ? ''
          : 'none';


      /*
       * Always start a newly selected Pokémon
       * on the Regular tab.
       */

      selectedRecordType =
        'regular';


      /*
       * ----------------------------------------------------------
       * Overall Record
       * ----------------------------------------------------------
       */

      updateRecordTab();

    }
    /*
     * ------------------------------------------------------------
     * Load all Pokémon lookup data
     * ------------------------------------------------------------
     */

    DBA.call(
      'pokemonLookupGetAll'
    )

      .then(
        data => {

          pokemonData =
            (data.pokemon || []).map(
              pokemon => ({

                ...pokemon,

                championships:
                  Array.isArray(
                    pokemon.championships
                  )
                    ? pokemon.championships
                    : [],

                drafts:
                  Array.isArray(
                    pokemon.drafts
                  )
                    ? pokemon.drafts
                    : []

              })
            );


          pokemonSel.innerHTML =
            '';


          const first =
            document.createElement(
              'option'
            );


          first.value =
            '';


          first.textContent =
            'Select a Pokémon...';


          pokemonSel.appendChild(
            first
          );


          pokemonData.forEach(
            (pokemon, index) => {

              const option =
                document.createElement(
                  'option'
                );


              option.value =
                index;


              option.textContent =
                pokemon.name;


              pokemonSel.appendChild(
                option
              );

            }
          );


          if (
  pokemonData.length === 0
) {

  console.error(
    'No Pokémon were found in PokemonInput.'
  );

  return;

}



          /*
           * Start with no Pokémon selected.
           */

          detailsEl.hidden =
            true;

        }
      )


      .catch(
        error => {

          console.error(
      'Error loading Pokémon data:',
      error
          );

        }
      );


    /*
     * ------------------------------------------------------------
     * Pokémon selection
     * ------------------------------------------------------------
     */

    function handlePokemonSelection() {

      const value =
        pokemonSel.value;


      if (
        value === ''
      ) {

        showPokemon(
          null
        );

        return;

      }


      const pokemon =
        pokemonData[
          Number(value)
        ];


      if (!pokemon) {

        showPokemon(
          null
        );

        return;

      }


      showPokemon(
        pokemon
      );

    }


    pokemonSel.addEventListener(
      'change',
      handlePokemonSelection
    );


    pokemonSel.addEventListener(
      'input',
      handlePokemonSelection
    );

  </script>

</body>
</html>
