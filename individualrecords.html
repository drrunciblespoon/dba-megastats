<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Individual Records - DBA Megastats</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="layout.css">
  <script src="shared.js"></script>
  <script src="api.js"></script>
</head>
<body class="centered page-individual">
  <h2>Individual Records</h2>

  <div class="controls">
    <div>
      <label for="player">Player</label>
      <select id="player"><option>Loading...</option></select>
    </div>
  </div>

  <table id="totals" class="totals" style="display:none">
    <thead>
      <tr><th>Player</th><th class="num">Wins</th><th class="num">Losses</th><th class="num">Net</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <h3 id="seasonsHeading" style="display:none">Season Records</h3>
  <table id="seasons" style="display:none">
    <thead>
      <tr><th>Season</th><th class="num">Pseudonym</th><th class="num">Record</th><th class="num">Play Off Status</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="status"></div>
  <table id="results" style="display:none">
    <thead>
      <tr><th>Opponent</th><th class="num">Wins</th><th class="num">Losses</th><th class="num">Net</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- NEW: Commonly Drafted -->
  <h3 id="repeatHeading" style="display:none">Commonly Drafted</h3>
  <table id="repeatDrafts" style="display:none">
    <thead>
      <tr><th>Pokémon</th><th>Spr.</th><th class="num">Times Drafted</th><th>Seasons</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
  const sel = DBA.$('player');
  const statusEl = DBA.$('status');
  const results = DBA.$('results');
  const totals = DBA.$('totals');
  const seasonsTbl = DBA.$('seasons');
  const seasonsHeading = DBA.$('seasonsHeading');

  const repeatTbl = DBA.$('repeatDrafts');
  const repeatHeading = DBA.$('repeatHeading');

  // Every player's record, loaded once and looked up by name.
  const players = new Map();

  // Repeat-draft data, keyed by exact player name, lower-cased.
  let repeatDrafts = {};


  /*
   * ------------------------------------------------------------
   * Hide all result sections
   * ------------------------------------------------------------
   */

  function clear() {

    DBA.show(results, false);
    DBA.show(totals, false);
    DBA.show(seasonsTbl, false);
    DBA.show(seasonsHeading, false);
    DBA.show(repeatTbl, false);
    DBA.show(repeatHeading, false);

    statusEl.textContent = '';

  }


  /*
   * ------------------------------------------------------------
   * Render repeat drafts
   * ------------------------------------------------------------
   */

  function renderRepeatDrafts(name) {

  const body =
    repeatTbl.querySelector('tbody');

  body.innerHTML = '';


  /*
   * Only show this section for Coaches.
   */

  const isCoach =
    /\(coach\)\s*$/i.test(name);


  if (!isCoach) {

    DBA.show(
      repeatHeading,
      false
    );

    DBA.show(
      repeatTbl,
      false
    );

    return;

  }


  /*
   * PokemonInput contains:
   *
   *   FT Morgan
   *
   * Individual Records contains:
   *
   *   FT Morgan (Coach)
   *
   * DBA.strip() removes the role suffix.
   */

  const playerKey =
  String(name)
    .replace(/\s+\(Coach\)\s*$/i, '')
    .trim()
    .toLowerCase();



  const list =
    repeatDrafts[playerKey] || [];


  list.forEach(
    p => {

      const tr =
        body.insertRow();


      /*
       * Pokémon
       */

      tr.insertCell()
        .textContent =
          p.name;


      /*
       * Sprite
       */

      const spriteCell =
        tr.insertCell();


      if (p.sprite) {

        const img =
          document.createElement('img');

        img.src =
          p.sprite;

        img.alt =
          p.name;

        img.loading =
          'lazy';

        spriteCell.appendChild(img);

      }


      /*
       * Times drafted
       */

      const countCell =
        tr.insertCell();

      countCell.textContent =
        p.count;

      countCell.className =
        'num';


      /*
       * Seasons
       */

      tr.insertCell()
        .textContent =
          p.seasons.join(', ');

    }
  );


  const hasRows =
    list.length > 0;


  DBA.show(
    repeatHeading,
    hasRows
  );

  DBA.show(
    repeatTbl,
    hasRows
  );

}


  /*
   * ------------------------------------------------------------
   * Render selected player
   * ------------------------------------------------------------
   */

  function render(name) {

    const p =
      players.get(name);


    if (!p) {

      clear();

      return;

    }


    const [w, l, found] =
      p.t;


    DBA.fillTotals(
      totals,
      [{
        label:
          p.n,

        wins:
          w,

        losses:
          l,

        net:
          w - l,

        found:
          !!found
      }]
    );


    const sn =
      DBA.fillTable(
        seasonsTbl,
        p.s.map(
          ([
            season,
            division,
            pseudonym,
            record,
            playoff
          ]) => [
            division
              ? season + ' (' + division + ')'
              : season,

            pseudonym,

            record,

            playoff.toLowerCase() === 'champion'
              ? '⭐ ' + playoff
              : playoff
          ]
        )
      );


    DBA.show(
      seasonsHeading,
      sn > 0
    );


    const n =
      DBA.fillTable(
        results,
        p.r.map(
          ([
            opponent,
            wins,
            losses
          ]) => [
            opponent,
            wins,
            losses,
            wins - losses
          ]
        )
      );


    statusEl.textContent =
      n
        ? ''
        : 'No records found.';


    /*
     * Repeat-draft table.
     */

    renderRepeatDrafts(name);

  }


  /*
   * ------------------------------------------------------------
   * Load player records
   * ------------------------------------------------------------
   */

  DBA.call('vwGetAll')

    .then(
      list => {

        list.forEach(
          player =>
            players.set(
              player.n,
              player
            )
        );


        DBA.fillSelect(
          sel,
          'player',
          list.map(
            player =>
              player.n
          )
        );

      }
    )

    .catch(
      error => {

        statusEl.textContent =
          'Error: ' +
          error.message;

      }
    );


  /*
   * ------------------------------------------------------------
   * Load repeat-draft data separately.
   *
   * A failure here does not break the rest of the page.
   * ------------------------------------------------------------
   */

  DBA.call('repeatDraftsGetAll')

    .then(
      data => {

        repeatDrafts =
          data &&
          data.players
            ? data.players
            : {};


        /*
         * The player may already have been selected before
         * this request completed.
         */

        if (sel.value) {
          renderRepeatDrafts(
            sel.value
          );
        }

      }
    )

    .catch(
      error => {

        console.error(
          'Repeat drafts failed:',
          error
        );

      }
    );


  /*
   * ------------------------------------------------------------
   * Player changed
   * ------------------------------------------------------------
   */

  sel.addEventListener(
    'change',
    () => {

      if (!sel.value) {

        clear();

        return;

      }


      render(
        sel.value
      );

    }
  );

</script>

</body>
</html>
