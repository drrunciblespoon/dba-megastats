<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Individual Records - DBA Megastats</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="layout.css">
  <script src="shared.js"></script>
  <script src="api.js"></script>
</head>
<body class="centered page-individual">
  <h2>Individual Records</h2>

  <div class="controls">
    <div>
      <label for="player">Player</label>
      <select id="player"><option>Loading...</option></select>
    </div>
  </div>

  <table id="totals" class="totals" style="display:none">
    <thead>
      <tr><th>Player</th><th class="num">Wins</th><th class="num">Losses</th><th class="num">Net</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <h3 id="seasonsHeading" style="display:none">Season Records</h3>
  <table id="seasons" style="display:none">
    <thead>
      <tr><th>Season</th><th class="num">Pseudonym</th><th class="num">Record</th><th class="num">Play Off Status</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="status"></div>
  <table id="results" style="display:none">
    <thead>
      <tr><th>Opponent</th><th class="num">Wins</th><th class="num">Losses</th><th class="num">Net</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- NEW: Commonly Drafted -->
  <h3 id="repeatHeading" style="display:none">Commonly Drafted</h3>
  <table id="repeatDrafts" style="display:none">
    <thead>
      <tr><th>Pokémon</th><th>Spr.</th><th class="num">Times Drafted</th><th>Seasons</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const sel = DBA.$('player');
    const statusEl = DBA.$('status');
    const results = DBA.$('results');
    const totals = DBA.$('totals');
    const seasonsTbl = DBA.$('seasons');
    const seasonsHeading = DBA.$('seasonsHeading');

    // NEW
    const repeatTbl = DBA.$('repeatDrafts');
    const repeatHeading = DBA.$('repeatHeading');

    // Every player's record, loaded once and looked up by name
    const players = new Map();

    // NEW: repeat drafts, keyed by tag-stripped lower-case player name
    let repeatDrafts = {};

    function clear() {
      DBA.show(results, false);
      DBA.show(totals, false);
      DBA.show(seasonsTbl, false);
      DBA.show(seasonsHeading, false);
      DBA.show(repeatTbl, false);        // NEW
      DBA.show(repeatHeading, false);    // NEW
      statusEl.textContent = '';
    }

    // NEW
    function renderRepeatDrafts(name) {
      const list = repeatDrafts[DBA.strip(name).toLowerCase()] || [];
      const body = repeatTbl.querySelector('tbody');
      body.innerHTML = '';

      list.forEach(p => {
        const tr = body.insertRow();

        tr.insertCell().textContent = p.name;

        const spriteCell = tr.insertCell();
        if (p.sprite) {
          const img = document.createElement('img');
          img.src = p.sprite;
          img.alt = p.name;
          img.loading = 'lazy';
          spriteCell.appendChild(img);
        }

        const count = tr.insertCell();
        count.textContent = p.count;
        count.className = 'num';

        tr.insertCell().textContent = p.seasons.join(', ');
      });

      DBA.show(repeatHeading, list.length > 0);
      DBA.show(repeatTbl, list.length > 0);
    }

    function render(name) {
      const p = players.get(name);
      if (!p) { clear(); return; }

      const [w, l, found] = p.t;
      DBA.fillTotals(totals, [{ label: p.n, wins: w, losses: l, net: w - l, found: !!found }]);

      const sn = DBA.fillTable(
        seasonsTbl,
        p.s.map(([season, division, pseudonym, record, playoff]) => [
          division ? season + ' (' + division + ')' : season,
          pseudonym,
          record,
          playoff.toLowerCase() === 'champion' ? '⭐ ' + playoff : playoff
        ])
      );
      DBA.show(seasonsHeading, sn > 0);

      const n = DBA.fillTable(
        results,
        p.r.map(([opponent, wins, losses]) => [opponent, wins, losses, wins - losses])
      );
      statusEl.textContent = n ? '' : 'No records found.';

      renderRepeatDrafts(name);          // NEW
    }

    DBA.call('vwGetAll')
      .then(list => {
        list.forEach(p => players.set(p.n, p));
        DBA.fillSelect(sel, 'player', list.map(p => p.n));
      })
      .catch(e => { statusEl.textContent = 'Error: ' + e.message; });

    // NEW: loaded separately, so a failure here can't break the rest of the page
    DBA.call('repeatDraftsGetAll')
      .then(data => {
        repeatDrafts = (data && data.players) || {};
        if (sel.value) renderRepeatDrafts(sel.value);   // player picked before this finished loading
      })
      .catch(e => console.error('Repeat drafts failed:', e));

    sel.addEventListener('change', () => {
      if (!sel.value) { clear(); return; }
      render(sel.value);
    });
  </script>
</body>
</html>
