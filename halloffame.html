<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Hall of Fame - DBA Megastats</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="layout.css">

  <script src="shared.js"></script>
  <script src="api.js"></script>
</head>

<body class="centered page-hof">

  <h2 id="title">Hall of Fame</h2>

  <div id="status">Loading...</div>

  <div id="root"></div>

  <script>

    const statusEl =
      DBA.$('status');

    const root =
      DBA.$('root');


    /*
     * ============================================================
     * Column rules
     * ============================================================
     *
     * Player columns:
     *   2, 3, 4, 5, 7
     *
     * Pokémon column:
     *   6
     *
     * JavaScript uses zero-based indexes:
     *
     *   Players: 1, 2, 3, 4, 6
     *   Pokémon: 5
     */

    const playerColumns =
      new Set([1, 2, 3, 4, 6]);

    const pokemonColumn = 5;


    /*
     * ============================================================
     * Load Hall of Fame data
     * ============================================================
     */

    DBA.call('hofGetData')

      .then(d => {

        DBA.$('title').textContent =
          d.title;

        statusEl.textContent =
          d.rows.length
            ? ''
            : 'No entries yet.';


        if (!d.rows.length) {
          return;
        }


        /*
         * ----------------------------------------------------------
         * Container
         * ----------------------------------------------------------
         */

        const box =
          document.createElement('div');

        box.style.marginTop =
          '20px';


        const wrap =
          document.createElement('div');

        wrap.className =
          'wrap';


        const table =
          document.createElement('table');

        wrap.appendChild(table);
        box.appendChild(wrap);


        /*
         * ----------------------------------------------------------
         * Header
         * ----------------------------------------------------------
         */

        const head =
          table.createTHead().insertRow();


        d.headers.forEach(name => {

          const th =
            document.createElement('th');

          th.textContent =
            name;

          head.appendChild(th);

        });


        /*
         * ----------------------------------------------------------
         * Rows
         * ----------------------------------------------------------
         */

        const body =
          table.createTBody();


        d.rows.forEach(row => {

          const tr =
            body.insertRow();


          row.forEach((cell, index) => {

            const td =
              tr.insertCell();


            /*
             * ------------------------------------------------------
             * Player columns
             * ------------------------------------------------------
             *
             * Columns 2-5 contain one player.
             */

            if (
              playerColumns.has(index) &&
              index !== 6
            ) {

              const name =
                cell.t || '';

              const link =
                DBA.playerLink(name);

              if (link) {

                td.appendChild(link);

              } else {

                td.textContent =
                  name;

              }

            }


            /*
             * ------------------------------------------------------
             * Column 7 - potentially multiple players
             * ------------------------------------------------------
             *
             * Example:
             *
             * Aiff / Blind Messiah
             *
             * Each name gets its own link.
             */

            else if (index === 6) {

              const text =
                cell.t || '';

              const players =
                text
                  .split('/')
                  .map(name => name.trim())
                  .filter(Boolean);


              players.forEach((name, playerIndex) => {

                if (playerIndex > 0) {

                  td.appendChild(
                    document.createTextNode(' / ')
                  );

                }

                const link =
                  DBA.playerLink(name);

                if (link) {

                  td.appendChild(link);

                } else {

                  td.appendChild(
                    document.createTextNode(name)
                  );

                }

              });

            }


            /*
             * ------------------------------------------------------
             * Column 6 - Pokémon
             * ------------------------------------------------------
             *
             * Normal:
             *
             * Garchomp (12-4)
             *
             * All Star MVP:
             *
             * ⭐ Garchomp (12-4) ⭐
             *
             * The stars remain visible.
             * Only the Pokémon name becomes a link.
             */

            else if (index === pokemonColumn) {

              const text =
                cell.t || '';


              /*
               * Find the Pokémon name and record while allowing
               * optional stars before and after the complete value.
               */

              const match =
                text.match(
                  /^(\s*⭐\s*)?(.+?)\s*(\(\s*\d+\s*-\s*\d+\s*\))(\s*⭐\s*)?$/
                );


              if (match) {

                const leadingStars =
                  match[1] || '';

                const pokemonName =
                  match[2].trim();

                const record =
                  match[3];

                const trailingStars =
                  match[4] || '';


                /*
                 * Keep everything in the same cell and on the
                 * same line.
                 */

                td.style.whiteSpace =
                  'nowrap';


                /*
                 * Leading star(s)
                 */

                if (leadingStars) {

                  td.appendChild(
                    document.createTextNode(
                      leadingStars.trim() + ' '
                    )
                  );

                }


                /*
                 * Pokémon name
                 */

                const link =
                  DBA.pokemonLink(pokemonName);

                if (link) {

                  link.style.display =
                    'inline';

                  td.appendChild(link);

                } else {

                  td.appendChild(
                    document.createTextNode(
                      pokemonName
                    )
                  );

                }


                /*
                 * Record
                 */

                td.appendChild(
                  document.createTextNode(
                    ' ' + record
                  )
                );


                /*
                 * Trailing star(s)
                 */

                if (trailingStars) {

                  td.appendChild(
                    document.createTextNode(
                      ' ' + trailingStars.trim()
                    )
                  );

                }

              } else {

                td.textContent =
                  text;

              }

            }


            /*
             * ------------------------------------------------------
             * Image cell
             * ------------------------------------------------------
             */

            else if (cell.img) {

              const img =
                document.createElement('img');

              img.src =
                cell.img;

              img.loading =
                'lazy';

              td.appendChild(img);

            }


            /*
             * ------------------------------------------------------
             * Normal cell
             * ------------------------------------------------------
             */

            else {

              td.textContent =
                cell.t;

              if (
                cell.n !== null &&
                cell.n !== undefined
              ) {

                td.className =
                  'num';

              }

            }

          });

        });


        root.appendChild(box);

      })

      .catch(e => {

        statusEl.textContent =
          'Error: ' + e.message;

      });

  </script>

</body>
</html>
