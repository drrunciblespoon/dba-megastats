<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Hall of Fame - DBA Megastats</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="layout.css">

  <script src="shared.js"></script>
  <script src="api.js"></script>
</head>

<body class="centered page-hof">

  <h2 id="title">Hall of Fame</h2>

  <div id="status">Loading...</div>

  <div id="root"></div>

  <script>

    const statusEl =
      DBA.$('status');

    const root =
      DBA.$('root');


    /*
     * ============================================================
     * Column rules
     * ============================================================
     *
     * Player columns:
     *   2, 3, 4, 5, 7
     *
     * Pokémon column:
     *   6
     *
     * JavaScript uses zero-based indexes, so these become:
     *   Players: 1, 2, 3, 4, 6
     *   Pokémon: 5
     */

    const playerColumns =
      new Set([1, 2, 3, 4, 6]);

    const pokemonColumn = 5;


    /*
     * ============================================================
     * Load Hall of Fame data
     * ============================================================
     */

    DBA.call('hofGetData')

      .then(d => {

        DBA.$('title').textContent =
          d.title;

        statusEl.textContent =
          d.rows.length
            ? ''
            : 'No entries yet.';


        if (!d.rows.length) {
          return;
        }


        /*
         * ----------------------------------------------------------
         * Container
         * ----------------------------------------------------------
         */

        const box =
          document.createElement('div');

        box.style.marginTop =
          '20px';


        const wrap =
          document.createElement('div');

        wrap.className =
          'wrap';


        const table =
          document.createElement('table');

        wrap.appendChild(table);
        box.appendChild(wrap);


        /*
         * ----------------------------------------------------------
         * Header
         * ----------------------------------------------------------
         */

        const head =
          table.createTHead().insertRow();


        d.headers.forEach(name => {

          const th =
            document.createElement('th');

          th.textContent =
            name;

          head.appendChild(th);

        });


        /*
         * ----------------------------------------------------------
         * Rows
         * ----------------------------------------------------------
         */

        const body =
          table.createTBody();


        d.rows.forEach(row => {

          const tr =
            body.insertRow();


          row.forEach((cell, index) => {

            const td =
              tr.insertCell();


            /*
             * ------------------------------------------------------
             * Player columns
             * ------------------------------------------------------
             */

            if (playerColumns.has(index)) {

              const name =
                cell.t || '';

              const link =
                DBA.playerLink(name);

              if (link) {

                td.appendChild(link);

              } else {

                td.textContent =
                  name;

              }

            }


            /*
             * ------------------------------------------------------
             * Pokémon column
             * ------------------------------------------------------
             */

            else if (index === pokemonColumn) {

              const text =
                cell.t || '';


              /*
               * Expected format:
               *
               * Pokémon Name (12-4)
               *
               * The Pokémon name becomes the link.
               * The record remains plain text.
               */

              const match =
                text.match(
                  /^(.+?)\s*(\(\s*\d+\s*-\s*\d+\s*\))$/
                );


              if (match) {

                const pokemonName =
                  match[1].trim();

                const record =
                  match[2];

                const link =
                  DBA.pokemonLink(pokemonName);


                if (link) {

                  td.appendChild(link);

                } else {

                  td.appendChild(
                    document.createTextNode(
                      pokemonName
                    )
                  );

                }


                td.appendChild(
                  document.createTextNode(
                    ' ' + record
                  )
                );

              } else {

                td.textContent =
                  text;

              }

            }


            /*
             * ------------------------------------------------------
             * Image cell
             * ------------------------------------------------------
             */

            else if (cell.img) {

              const img =
                document.createElement('img');

              img.src =
                cell.img;

              img.loading =
                'lazy';

              td.appendChild(img);

            }


            /*
             * ------------------------------------------------------
             * Normal cell
             * ------------------------------------------------------
             */

            else {

              td.textContent =
                cell.t;

              if (
                cell.n !== null &&
                cell.n !== undefined
              ) {

                td.className =
                  'num';

              }

            }

          });

        });


        root.appendChild(box);

      })

      .catch(e => {

        statusEl.textContent =
          'Error: ' + e.message;

      });

  </script>

</body>
</html>
