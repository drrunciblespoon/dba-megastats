<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>DBA Megastats</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="layout.css">

  <script src="shared.js"></script>
  <script src="api.js"></script>
</head>

<body class="centered page-individual">

  <h2>Player Look Up</h2>
  
  <div class="controls">
    <div>
      <label for="player">Player</label>
      <select id="player"><option>Loading...</option></select>
    </div>
  </div>

  <div
  id="playerNotFound"
  class="pokemon-not-found"
  hidden
>
  <img
    src="unknowntrainer.png"
    alt=""
  >

  <p>
    That player hasn't played in DBA...
  </p>
</div>

  <!-- Player championships -->
  <div
    id="playerChampionships"
    class="pokemon-championships"
    aria-label="Player championships"
    style="display:none"
  ></div>

  
  
 <!-- Overall totals and Coach MVP -->
<div id="playerOverview" class="player-overview">

  <div id="totalsBlock" class="totals-block" style="display:none">
    <table id="totals" class="totals nosort">
      <thead>
        <tr>
          <th id="totalsName">Player</th>
          <th class="num">Wins</th>
          <th class="num">Losses</th>
          <th class="num">Net</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="coachMvp" class="coach-mvp" style="display:none">
    <img id="coachMvpSprite" src="" alt="">
    <p id="coachMvpCaption"></p>
  </div>

</div>

  <h3 id="seasonsHeading" style="display:none">Season Records</h3>

  <!-- Role tabs + season records -->
  <div id="seasonsBlock" class="totals-block">

    <div id="roleTabs" class="role-tabs" style="display:none">
      <button type="button" id="coachTab" class="role-tab">Coach</button>
      <button type="button" id="battlerTab" class="role-tab">Battler</button>
    </div>

    <table id="seasons" style="display:none">
      <thead>
        <tr>
          <th>Season</th>
          <th>Pseudonym</th>
          <th class="num">Record</th>
          <th class="num">Play Off Status</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

  </div>

  <div id="status"></div>

  <table id="results" style="display:none">
    <thead>
      <tr>
        <th>Opponent</th>
        <th class="num">Wins</th>
        <th class="num">Losses</th>
        <th class="num">Net</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h3 id="repeatHeading" style="display:none">Commonly Drafted</h3>

  <table id="repeatDrafts" style="display:none">
    <thead>
      <tr>
        <th>Pokémon</th>
        <th>Spr.</th>
        <th class="num">Times Drafted</th>
        <th>Seasons</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>


  <script>

    /* ============================================================
     * Elements
     * ============================================================ */

    const sel            = DBA.$('player');
    const playerNotFoundEl = DBA.$('playerNotFound');
    const statusEl       = DBA.$('status');
    const playerChampionships = DBA.$('playerChampionships');
    const results        = DBA.$('results');
    const totals         = DBA.$('totals');
    const totalsBlock    = DBA.$('totalsBlock');
    const totalsName     = DBA.$('totalsName');
    const roleTabs       = DBA.$('roleTabs');
    const coachTab       = DBA.$('coachTab');
    const battlerTab     = DBA.$('battlerTab');
    const seasonsBlock   = DBA.$('seasonsBlock');
    const seasonsTbl     = DBA.$('seasons');
    const seasonsHeading = DBA.$('seasonsHeading');
    const repeatTbl      = DBA.$('repeatDrafts');
    const repeatHeading  = DBA.$('repeatHeading');
    const coachMvp = DBA.$('coachMvp');
const coachMvpSprite = DBA.$('coachMvpSprite');
const coachMvpCaption = DBA.$('coachMvpCaption');


    /* ============================================================
     * Data
     * ============================================================ */

    // displayName -> { name, coach, battler }
    const groups = new Map();

    let repeatDrafts = {};
    let individualDrafts = {};
    let individualDraftsLoaded = false;
    let playerRecordTrophies = {};
    let mostPlayerParticipationsTrophies = {};

    let currentName = '';
    let currentRole = 'coach';


    /* ============================================================
     * Normalisers (must match the backend keys)
     * ============================================================ */

    function normalisePlayerName(name) {
      return String(name)
        .replace(/\s*\((coach|battler)\)\s*$/i, '')
        .trim()
        .toLowerCase();
    }

    function normaliseTeamName(name) {
  return String(name)
    .trim()
    .toLowerCase();
}

    function normaliseSeason(season) {
      const m = String(season).match(/\d+/);
      return m ? m[0] : String(season).trim();
    }

    
function getSeasonRecordsUrl(season, division) {
  const seasonNumber = String(season || '').match(/\d+/)?.[0];

  const seasonWords = {
    1: 'one',
    2: 'two',
    3: 'three',
    4: 'four',
    5: 'five',
    6: 'six',
    7: 'seven',
    8: 'eight',
    9: 'nine',
    10: 'ten'
  };

  if (!seasonNumber) return null;

  const seasonKey =
    seasonWords[seasonNumber] || seasonNumber;

  const divisionKey = String(division || '')
    .toLowerCase()
    .replace(/[^a-z0-9]/g, '');

  if (!divisionKey) return null;

  return 'https://dbamegastats.xyz/seasonlookup.html?season='
    + seasonKey
    + divisionKey;
}


    /* ============================================================
     * Hide everything
     * ============================================================ */

    function clear() {
  DBA.show(totalsBlock, false);
  DBA.show(results, false);
  DBA.show(seasonsTbl, false);
  DBA.show(seasonsHeading, false);
  DBA.show(repeatTbl, false);
  DBA.show(repeatHeading, false);

  playerChampionships.innerHTML = '';
playerChampionships.style.display = 'none';

  roleTabs.style.display = 'none';
  statusEl.textContent = '';

  playerNotFoundEl.hidden = true;
}

    

    /* ============================================================
     * Draft table (nested under a season row)
     * ============================================================ */

    function createDraftTable(rows) {

      const table = document.createElement('table');
      table.className = 'individual-draft-table';

      const headers = [
        'Pokémon', 'Spr.', 'GP.', 'Kills',
        'Deaths', 'Diff.', 'Wins', 'Losses', 'WR.'
      ];

      const headRow = table.createTHead().insertRow();

      headers.forEach((text, i) => {
        const th = document.createElement('th');
        th.textContent = text;
        if (i >= 2) th.className = 'num';
        headRow.appendChild(th);
      });

      const tbody = table.createTBody();

      if (!rows || rows.length === 0) {
        const cell = tbody.insertRow().insertCell();
        cell.colSpan = headers.length;
        cell.textContent = 'No draft data found.';
        return table;
      }

      const text = (v, fallback) =>
        v === '' || v === null || v === undefined ? fallback : v;

            rows.forEach(draft => {

        const tr = tbody.insertRow();

        const pokemonCell =
          tr.insertCell();

        const pokemonName =
          text(draft.pokemon, '–');

        if (pokemonName === '–') {

          pokemonCell.textContent =
            '–';

        } else {

          const link =
            DBA.pokemonLink(pokemonName)


          if (link) {
            pokemonCell.appendChild(link);
          } else {
            pokemonCell.textContent =
              pokemonName;
          }

        }

        const spriteCell =
          tr.insertCell();

        const spriteUrl = DBA.spriteUrl(
  draft.pokemon,
  draft.sprite
);

if (spriteUrl) {
  const img = document.createElement('img');
  img.src = spriteUrl;
  img.alt = draft.pokemon || '';
  img.loading = 'lazy';
  spriteCell.appendChild(img);
}

        [
          text(draft.appearances, '–'),
          text(draft.kills, '–'),
          text(draft.deaths, '–'),
          text(draft.diff, '–'),
          text(draft.wins, '0'),
          text(draft.losses, '0'),
          text(draft.wr, 'No Games')
        ].forEach(v => {
          const td = tr.insertCell();
          td.className = 'num';
          td.textContent = v;
        });

      });

      return table;
    }


    /* ============================================================
     * Expand / collapse a season row
     * ============================================================ */

    function collapseSeasonRow(row) {
      const next = row.nextElementSibling;
      if (next && next.classList.contains('season-draft-row')) next.remove();
      row.classList.remove('expanded');
    }
function toggleSeasonRow(row) {
  const existing = row.nextElementSibling;

      if (existing && existing.classList.contains('season-draft-row')) {
        collapseSeasonRow(row);
        return;
      }

      seasonsTbl
        .querySelectorAll('tbody tr.season-row')
        .forEach(other => {
          if (other !== row) collapseSeasonRow(other);
        });

      const draftRows =
        ((individualDrafts[row.dataset.player] || {})
          [row.dataset.team] || {})
          [row.dataset.season] || [];

      const expandedRow = document.createElement('tr');
      expandedRow.className = 'season-draft-row';

      const expandedCell = document.createElement('td');
      expandedCell.colSpan = 4;

      const wrapper = document.createElement('div');
      wrapper.className = 'season-draft-wrapper';

      if (!individualDraftsLoaded) {
        const loading = document.createElement('div');
        loading.className = 'season-draft-loading';
        loading.textContent = 'Loading draft…';
        wrapper.appendChild(loading);
      } else {
        wrapper.appendChild(createDraftTable(draftRows));
      }

      expandedCell.appendChild(wrapper);
      expandedRow.appendChild(expandedCell);
      row.after(expandedRow);
      row.classList.add('expanded');
    }


    /* ============================================================
     * Season records (rows clickable for Coaches only)
     * ============================================================ */

    function renderSeasonRecords(name, player, isCoach) {

      const tbody = seasonsTbl.querySelector('tbody');
      tbody.innerHTML = '';

      if (!player || !player.s || player.s.length === 0) {
        DBA.show(seasonsHeading, false);
        DBA.show(seasonsTbl, false);
        return;
      }

      player.s.forEach(([season, division, pseudonym, record, playoff]) => {

        const row = document.createElement('tr');
        row.className = 'season-row';
        const isSub = String(season).trim().toUpperCase().startsWith('SUB');

        row.dataset.player = normalisePlayerName(name);
        row.dataset.team = normaliseTeamName(pseudonym);
        row.dataset.season = normaliseSeason(season);

        

const seasonCell = document.createElement('td');

const seasonLabel = division
  ? season + ' (' + division + ')'
  : season;

const seasonUrl = getSeasonRecordsUrl(season, division);

const seasonContent = document.createElement('div');
seasonContent.className = 'season-cell-content';

if (seasonUrl) {
  const link = document.createElement('a');
  link.href = seasonUrl;
  link.textContent = seasonLabel;
  link.style.display = 'inline';
  seasonContent.appendChild(link);
} else {
  const label = document.createElement('span');
  label.textContent = seasonLabel;
  seasonContent.appendChild(label);
}


if (isCoach && !isSub) {
  const arrow = document.createElement('span');
  arrow.className = 'season-expand-arrow';
  arrow.textContent = '▾';
  arrow.setAttribute('aria-hidden', 'true');
  seasonContent.appendChild(arrow);
}


seasonCell.appendChild(seasonContent);
row.appendChild(seasonCell);
        
        const pseudonymCell = document.createElement('td');
        pseudonymCell.textContent = pseudonym || '–';
        row.appendChild(pseudonymCell);

        const recordCell = document.createElement('td');
        recordCell.className = 'num';
        recordCell.textContent = record || '–';
        row.appendChild(recordCell);

        const playoffCell = document.createElement('td');
        playoffCell.className = 'num';
        playoffCell.textContent =
          playoff && playoff.toLowerCase() === 'champion'
            ? '⭐ ' + playoff
            : playoff || '–';
        row.appendChild(playoffCell);

        

if (isCoach && !isSub) {
  row.title = 'Click to show draft';
  row.addEventListener('click', event => {
    if (event.target.closest('a')) return;
    toggleSeasonRow(row);
  });
}



        tbody.appendChild(row);

      });

      DBA.show(seasonsHeading, true);
      DBA.show(seasonsTbl, true);
    }


    /* ============================================================
     * Commonly Drafted (Coach tab only)
     * ============================================================ */

    function renderRepeatDrafts(name, isCoach) {

      const body = repeatTbl.querySelector('tbody');
      body.innerHTML = '';

      if (!isCoach) {
        DBA.show(repeatHeading, false);
        DBA.show(repeatTbl, false);
        return;
      }

      const list = repeatDrafts[normalisePlayerName(name)] || [];

      list.forEach(p => {

        const tr = body.insertRow();

                const pokemonCell =
          tr.insertCell();

        const link =
         DBA.pokemonLink(p.name);


        if (link) {
          pokemonCell.appendChild(link);
        } else {
          pokemonCell.textContent =
            p.name || '–';
        }

        const spriteCell =
          tr.insertCell();

        const spriteUrl = DBA.spriteUrl(
  p.name,
  p.sprite
);

if (spriteUrl) {
  const img = document.createElement('img');
  img.src = spriteUrl;
  img.alt = p.name;
  img.loading = 'lazy';
  spriteCell.appendChild(img);
}

        const countCell = tr.insertCell();
        countCell.textContent = p.count;
        countCell.className = 'num';

        tr.insertCell().textContent = p.seasons.join(', ');

      });

      DBA.show(repeatHeading, list.length > 0);
      DBA.show(repeatTbl, list.length > 0);
    }

/* ============================================================
 * Coach MVP — Pokémon with the most total kills
 * ============================================================ */

function renderCoachMvp(name, coach) {

  // Hide the MVP if the player has no Coach record.
  if (!coach) {
    coachMvp.style.display = 'none';
    coachMvpSprite.removeAttribute('src');
    coachMvpCaption.textContent = '';
    return;
  }

  const playerKey = normalisePlayerName(name);
  const playerDrafts = individualDrafts[playerKey] || {};

  // Aggregate kills across every team and season.
  const pokemonTotals = new Map();

  Object.values(playerDrafts).forEach(seasons => {

    if (!seasons || typeof seasons !== 'object') return;

    Object.values(seasons).forEach(drafts => {

      if (!Array.isArray(drafts)) return;

      drafts.forEach(draft => {

        const pokemon = String(draft.pokemon || '').trim();

        if (!pokemon) return;

        const kills = Number(draft.kills);

        if (!Number.isFinite(kills)) return;

        const key = pokemon.toLowerCase();
        const existing = pokemonTotals.get(key);

        if (existing) {
          existing.kills += kills;

          // Keep a sprite URL if one is available.
          if (!existing.sprite && draft.sprite) {
            existing.sprite = draft.sprite;
          }
        } else {
          pokemonTotals.set(key, {
            name: pokemon,
            kills,
            sprite: draft.sprite || ''
          });
        }

      });

    });

  });

  const candidates = [...pokemonTotals.values()]
    .filter(pokemon => pokemon.kills > 0)
    .sort((a, b) => b.kills - a.kills);

  // No usable draft data or no Pokémon with kills.
  if (candidates.length === 0) {
    coachMvp.style.display = 'none';
    coachMvpSprite.removeAttribute('src');
    coachMvpCaption.textContent = '';
    return;
  }

  const mvp = candidates[0];

const spriteUrl = DBA.spriteUrl(
  mvp.name,
  mvp.sprite
);

if (spriteUrl) {
  coachMvpSprite.src = spriteUrl;
  coachMvpSprite.alt = mvp.name;
  coachMvpSprite.style.display = '';
} else {
    coachMvpSprite.removeAttribute('src');
    coachMvpSprite.alt = '';
    coachMvpSprite.style.display = 'none';
  }

  coachMvpCaption.textContent = `MVP – ${mvp.kills} Kills`;
  coachMvp.style.display = 'flex';
}
    
/* ============================================================
 * Player Championships and Runner Up Awards
 * ============================================================ */

function renderPlayerChampionships(group) {

  playerChampionships.innerHTML = '';

  // Check both roles, regardless of the currently selected tab.
  const players = [
    { player: group.coach, role: 'Coach' },
    { player: group.battler, role: 'Battler' }
  ];

  const championships = [];
  const runnersUp = [];
  const playerRecords = [];
  const participationLeaders = [];

  players.forEach(({ player, role }) => {

    if (!player || !Array.isArray(player.s)) {
      return;
    }

    player.s.forEach(([season, division, pseudonym, record, playoff]) => {

      const status = String(playoff || '').trim().toLowerCase();

      let icon;
      let label;
      let target;
      let isRunnerUp = false;

      if (status === 'champion') {

        icon = 'GoldTrophy.png';
        label = 'Champion';
        target = championships;

      } else if (status === 'runner up') {

        icon = '🥈';
        label = 'Runner Up';
        target = runnersUp;
        isRunnerUp = true;

      } else {
        return;
      }

      // Avoid displaying "Season Season 3".
      const seasonText = String(season || '').trim()
        .replace(/^season\s*/i, '');

      target.push({
        icon,
        isRunnerUp,
        caption: `Season ${seasonText} ${label}${
          division ? ` (${division})` : ''
        } (${role})`
      });

    });

  });

  
  // Add Player Stats record trophies for this player.
  const recordAwards =
    playerRecordTrophies[normalisePlayerName(group.name)] || [];

  recordAwards.forEach(({ title }) => {
    if (!title) return;

    playerRecords.push({
      icon: 'playerrecordstrophy.png',
      isPlayerRecord: true,
      caption: title
    });
  });

  // Add participation leader trophies for this player.
const participationAwards =
  mostPlayerParticipationsTrophies[normalisePlayerName(group.name)] || [];

participationAwards.forEach(({ title }) => {
  if (!title) return;

  participationLeaders.push({
    icon: 'numberonetrophy.png',
    isParticipationLeader: true,
    caption: title
  });
});


  // Display all championships first, then all runner-ups.
  const awards = [
  ...championships,
  ...runnersUp,
  ...playerRecords,
  ...participationLeaders
];

  // Hide the section if there are no awards.
  if (awards.length === 0) {
    playerChampionships.style.display = 'none';
    return;
  }

  playerChampionships.style.display = 'flex';

  // Display all award icons in one row/group.
  const trophyRow = document.createElement('div');
  trophyRow.className = 'pokemon-trophy-row';

  
  // Display captions underneath the icons.
  const captionList = document.createElement('div');
  captionList.className = 'pokemon-winner-list';

  awards.forEach(({
  icon,
  isRunnerUp,
  isPlayerRecord,
  isParticipationLeader,
  caption
}) => {
    let trophy;

    if (isPlayerRecord) {
      // Player Stats record trophy.
      trophy = document.createElement('img');
      trophy.src =
        'https://raw.githubusercontent.com/drrunciblespoon/dba-megastats/main/playerrecordstrophy.png';
      trophy.alt = caption;
      trophy.title = caption;
      trophy.className =
        'pokemon-trophy pokemon-player-record-trophy';

    } else if (icon === 'GoldTrophy.png') {
      // Existing championship trophy.
      trophy = document.createElement('img');
      trophy.src = icon;
      trophy.alt = 'Champion';
      trophy.className = 'pokemon-trophy pokemon-gold-trophy';

    } else if (isParticipationLeader) {
  // Player participation leader trophy.
  trophy = document.createElement('img');
  trophy.src =
    'https://raw.githubusercontent.com/drrunciblespoon/dba-megastats/main/numberonetrophy.png';
  trophy.alt = caption;
  trophy.title = caption;
  trophy.className =
    'pokemon-trophy pokemon-participation-leader-trophy';

    } else {
      // Existing runner-up medal.
      trophy = document.createElement('span');
      trophy.className = isRunnerUp
        ? 'pokemon-trophy pokemon-medal'
        : 'pokemon-trophy';
      trophy.textContent = icon;
    }

    trophyRow.appendChild(trophy);

    const captionEl = document.createElement('div');
    captionEl.className = 'pokemon-winner';
    captionEl.textContent = caption;
    captionList.appendChild(captionEl);
  });

  playerChampionships.appendChild(trophyRow);
  playerChampionships.appendChild(captionList);


}

    /* ============================================================
     * Render the selected player in the selected role
     * ============================================================ */

    function render(name) {

      const group = groups.get(name);

      if (!group) {
        clear();
        return;
      }

      currentName = name;

renderPlayerChampionships(group);

renderCoachMvp(name, group.coach);
      
      const hasCoach = !!group.coach;
const hasBattler = !!group.battler;
const hasBoth = hasCoach && hasBattler;

const countRealSeasons = player => {

  if (!player || !Array.isArray(player.s)) {
    return 0;
  }

  return player.s.filter(([season]) => {
    return !String(season).trim().toUpperCase().startsWith('SUB');
  }).length;

};

let totalSeasons =
  countRealSeasons(group.coach) +
  countRealSeasons(group.battler);

// If the player appeared in both roles during the same season,
// count that season only once.
if (hasBoth) {
  const coachSeasons = new Set(
    (group.coach.s || [])
      .filter(([season]) =>
        !String(season).trim().toUpperCase().startsWith('SUB')
      )
      .map(([season]) => normaliseSeason(season))
  );

  const battlerSeasons = new Set(
    (group.battler.s || [])
      .filter(([season]) =>
        !String(season).trim().toUpperCase().startsWith('SUB')
      )
      .map(([season]) => normaliseSeason(season))
  );

  const sharedSeasons = [...coachSeasons]
    .filter(season => battlerSeasons.has(season));

  totalSeasons -= sharedSeasons.length;
}


      // Keep the current tab if this player has it; otherwise fall back.
      if (!group[currentRole]) {
        currentRole = hasCoach ? 'coach' : 'battler';
      }

      const p = group[currentRole];
      const isCoach = currentRole === 'coach';

      /* ---- Tabs ---- */

      roleTabs.style.display = hasBoth ? '' : 'none';
      seasonsBlock.classList.toggle('has-tabs', hasBoth);
      coachTab.classList.toggle('active', isCoach);
      battlerTab.classList.toggle('active', !isCoach);

      /* ---- Totals: Coach / Battler / Combined ---- */

      
totalsName.textContent =
  `${group.name} (${totalSeasons} ${totalSeasons === 1 ? 'Season' : 'Seasons'})`;



      const toItem = (label, rec) => {
        const [w, l, found] = rec.t;
        return { label, wins: w, losses: l, net: w - l, found: !!found };
      };

      const items = [];

      if (hasCoach) items.push(toItem('Coach', group.coach));
      if (hasBattler) items.push(toItem('Battler', group.battler));

      if (hasBoth) {
        const cw = group.coach.t[0], cl = group.coach.t[1];
        const bw = group.battler.t[0], bl = group.battler.t[1];
        items.push({
          label: 'Combined',
          wins: cw + bw,
          losses: cl + bl,
          net: (cw + bw) - (cl + bl),
          found: !!(group.coach.t[2] || group.battler.t[2])
        });
      }

      DBA.fillTotals(totals, items);
      DBA.show(totalsBlock, true);

      /* ---- Season records ---- */

      renderSeasonRecords(name, p, isCoach);

      // Keep the heading visible when there are tabs, even if this
      // role has no seasons, so the user can still switch back.
      if (hasBoth) DBA.show(seasonsHeading, true);

      /* ---- Opponent records ---- */

    const resultsBody =
      results.querySelector('tbody');

    resultsBody.innerHTML = '';

    p.r.forEach(([opponent, wins, losses]) => {

      const tr =
        resultsBody.insertRow();

      const opponentCell =
        tr.insertCell();

      const link =
        DBA.playerLink(opponent);

      if (link) {
        opponentCell.appendChild(link);
      } else {
        opponentCell.textContent =
          opponent || '–';
      }

      [
        wins,
        losses,
        wins - losses
      ].forEach(value => {

        const td =
          tr.insertCell();

        td.className = 'num';
        td.textContent = value;

      });

    });

    const n = p.r.length;

    statusEl.textContent =
      n ? '' : 'No records found.';

    DBA.show(
      results,
      n > 0
    );


      /* ---- Commonly drafted ---- */

      renderRepeatDrafts(name, isCoach);
    }


    /* ============================================================
     * Tab buttons
     * ============================================================ */

    coachTab.onclick = () => {
      currentRole = 'coach';
      render(currentName);
    };

    battlerTab.onclick = () => {
      currentRole = 'battler';
      render(currentName);
    };


    /* ============================================================
     * Load player records and group Coach / Battler entries
     * ============================================================ */

    DBA.call('vwGetAll')

      .then(list => {

        const byKey = new Map();

        list.forEach(player => {

          const key = normalisePlayerName(player.n);

          if (!byKey.has(key)) {
            byKey.set(key, {
              name: DBA.strip(player.n),
              coach: null,
              battler: null
            });
          }

          const group = byKey.get(key);

          if (/\(coach\)\s*$/i.test(player.n)) {
            group.coach = player;
          } else {
            // "(Battler)" or untagged
            group.battler = player;
          }

        });

        byKey.forEach(group => groups.set(group.name, group));

        DBA.fillSelect(
          sel,
          'player',
          Array.from(groups.keys()).sort((a, b) => a.localeCompare(b))
        );

        const requestedPlayer =
  new URLSearchParams(window.location.search)
    .get('player');

if (requestedPlayer) {

  const match =
    Array.from(groups.keys())
      .find(
        name =>
          normalisePlayerName(name) ===
          normalisePlayerName(requestedPlayer)
      );

  if (match) {

    // Player exists: show their normal lookup page.
    playerNotFoundEl.hidden = true;
    sel.value = match;
    render(match);

  } else {

    // Player doesn't exist: show the error landing page.
    clear();
    sel.value = '';
    playerNotFoundEl.hidden = false;

  }

}


      })

      .catch(error => {
        statusEl.textContent = 'Error: ' + error.message;
      });

/* ============================================================
 * Load Player Stats record trophies
 * ============================================================ */

DBA.call('playerRecordTrophiesGetAll')
  .then(data => {
    playerRecordTrophies =
      data && data.players ? data.players : {};

    // If a player is already displayed, refresh their awards.
    if (currentName) {
      const group = groups.get(currentName);

      if (group) {
        renderPlayerChampionships(group);
      }
    }
  })
  .catch(error => {
    console.error('Player record trophies failed:', error);
  });

    DBA.call('mostPlayerParticipations')
  .then(data => {
    mostPlayerParticipationsTrophies =
      data && data.players ? data.players : {};

    if (currentName) {
      const group = groups.get(currentName);
      if (group) renderPlayerChampionships(group);
    }
  })
  .catch(error => {
    console.error('Player participation trophies failed:', error);
  });


    /* ============================================================
     * Load repeat-draft data (failure doesn't break the page)
     * ============================================================ */

    DBA.call('repeatDraftsGetAll')

      .then(data => {

        repeatDrafts = data && data.players ? data.players : {};

        if (sel.value && currentName) render(currentName);

      })

      .catch(error => {
        console.error('Repeat drafts failed:', error);
      });


    /* ============================================================
     * Load season-specific drafts (failure doesn't break the page)
     * ============================================================ */

    DBA.call('individualDraftsGetAll')

      .then(data => {

        individualDrafts = data && data.drafts ? data.drafts : {};
        individualDraftsLoaded = true;

        if (currentName) {
  const group = groups.get(currentName);

  if (group) {
    renderCoachMvp(currentName, group.coach);
  }
}

        // Swap any open "Loading draft…" for the real table.
        const expandedRow =
          seasonsTbl.querySelector('tbody tr.season-draft-row');

        if (expandedRow) {
          const seasonRow = expandedRow.previousElementSibling;
          if (seasonRow && seasonRow.classList.contains('season-row')) {
            collapseSeasonRow(seasonRow);
            toggleSeasonRow(seasonRow);
          }
        }

      })

      .catch(error => {
        console.error('Individual drafts failed:', error);
        individualDraftsLoaded = true;
      });


    /* ============================================================
     * Player changed
     * ============================================================ */

  sel.addEventListener('change', () => {

      playerNotFoundEl.hidden = true;

  if (!sel.value) {
    currentName = '';
    clear();
    return;
  }

  window.history.pushState(
    {},
    '',
    DBA.playerUrl(sel.value)
  );

  render(sel.value);

});



  </script>

</body>
</html>
