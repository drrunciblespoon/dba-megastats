
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Season Records - DBA Megastats</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="layout.css">

  <script src="shared.js"></script>
  <script src="api.js"></script>
</head>

<body class="centered page-season-records">

  <h2>Season Records</h2>

  <div class="controls season-record-controls">
    <div>
      <label for="seasonSel">Season</label>
      <select id="seasonSel" disabled>
        <option>Loading...</option>
      </select>
    </div>

    <div>
      <label for="divisionSel">Division</label>
      <select id="divisionSel" disabled>
        <option>Select a season first</option>
      </select>
    </div>
  </div>

  <div id="status" role="status" aria-live="polite"></div>

  <div id="seasonRoot"></div>

  <script>
    const seasonSel = DBA.$('seasonSel');
    const divisionSel = DBA.$('divisionSel');
    const statusEl = DBA.$('status');
    const root = DBA.$('seasonRoot');

    let options = [];
    let currentData = null;
    let activeRole = 'coach';
    let requestToken = 0;

    function selectedOption() {
      return options.find(option =>
        option.season === seasonSel.value &&
        option.division === divisionSel.value
      );
    }

    /* =========================================================
       URL HELPERS

       A single URL parameter identifies both the season and
       division, e.g. ?season=onefrontier or ?season=sixtower.
       ========================================================= */

    function normaliseSeasonKey(value) {
      return String(value || '')
        .toLowerCase()
        .replace(/[^a-z0-9]/g, '');
    }

    function getSeasonKey(option) {
      const seasonText = String(option.season || '');
      const seasonNumber = seasonText.match(/\d+/)?.[0];

      const seasonWords = {
        1: 'one',
        2: 'two',
        3: 'three',
        4: 'four',
        5: 'five',
        6: 'six',
        7: 'seven',
        8: 'eight',
        9: 'nine',
        10: 'ten'
      };

      const seasonKey = seasonNumber
        ? (seasonWords[seasonNumber] || seasonNumber)
        : normaliseSeasonKey(seasonText);

      return seasonKey + normaliseSeasonKey(option.division);
    }

    function getRequestedSeasonOption() {
      const params = new URLSearchParams(window.location.search);
      const requestedKey = normaliseSeasonKey(
        params.get('season')
      );

      if (!requestedKey) return null;

      return options.find(option =>
        getSeasonKey(option) === requestedKey
      ) || null;
    }

    function updateSeasonUrl(selection) {
      if (!selection) return;

      const params = new URLSearchParams(window.location.search);

      params.set('season', getSeasonKey(selection));

      const query = params.toString();

      const newUrl =
        window.location.pathname +
        (query ? '?' + query : '') +
        window.location.hash;

      window.history.replaceState(null, '', newUrl);
    }

    /* =========================================================
       SELECTOR POPULATION
       ========================================================= */

    function populateSeasons() {
      const seasons = [...new Set(
        options.map(option => option.season)
      )];

      seasonSel.replaceChildren();

      seasons.forEach(season => {
        const option = document.createElement('option');

        option.value = season;
        option.textContent =
          'Season ' + season.replace(/^Season\s*/i, '');

        seasonSel.appendChild(option);
      });
    }

    function populateDivisions(preferredDivision) {
      const season = seasonSel.value;

      const divisions = options.filter(option =>
        option.season === season
      );

      divisionSel.replaceChildren();

      divisions.forEach(item => {
        const option = document.createElement('option');

        option.value = item.division;
        option.textContent = item.division;

        divisionSel.appendChild(option);
      });

      if (
        preferredDivision &&
        divisions.some(item => item.division === preferredDivision)
      ) {
        divisionSel.value = preferredDivision;
      }

      divisionSel.disabled = divisions.length === 0;
    }

    /* =========================================================
       MAIN SEASON TABLE
       ========================================================= */

    function makeTable(headers, rows, className) {
      const table = document.createElement('table');

      table.className = className || '';
      table.dataset.seasonTable = 'true';

      const hasRank = className === 'season-main-table';

      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');

      if (hasRank) {
        const th = document.createElement('th');

        th.textContent = 'Rank';
        th.dataset.c = 'rank';
        th.scope = 'col';

        headerRow.appendChild(th);
      }

      headers.forEach((header, index) => {
        const th = document.createElement('th');

        th.textContent = header;
        th.dataset.c = index;
        th.scope = 'col';

        headerRow.appendChild(th);
      });

      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');

      rows.forEach((row, rowIndex) => {
        const tr = document.createElement('tr');

        if (hasRank) {
          const rankCell = document.createElement('td');

          rankCell.textContent = String(rowIndex + 1);
          rankCell.dataset.c = 'rank';
          rankCell.className = 'num';

          tr.appendChild(rankCell);
        }

        row.forEach((value, index) => {
          const td = document.createElement('td');
          const text = value == null ? '' : String(value);

          td.dataset.c = index;

          const isPlayerColumn =
            (hasRank && index === 0);

          if (isPlayerColumn && text.trim()) {
            const link = DBA.playerLink(text);

            if (link) {
              td.appendChild(link);
            } else {
              td.textContent = text;
            }
          } else {
            td.textContent = text;
          }

          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      });

      if (!rows.length) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');

        td.colSpan = headers.length + (hasRank ? 1 : 0);
        td.className = 'season-record-empty';
        td.textContent = 'No records available.';

        tr.appendChild(td);
        tbody.appendChild(tr);
      }

      table.appendChild(tbody);

      return table;
    }

    function makeTableWrapper(table) {
      const wrapper = document.createElement('div');

      wrapper.className = 'season-record-table-wrap';
      wrapper.appendChild(table);

      return wrapper;
    }

    /* =========================================================
       COACH / BATTLER TABS
       ========================================================= */

    function renderRoleTabs(container) {
      const tabs = document.createElement('div');

      tabs.className = 'season-record-tabs';
      tabs.setAttribute('role', 'tablist');
      tabs.setAttribute('aria-label', 'Player class');

      [
        { id: 'coach', label: 'Coach' },
        { id: 'battler', label: 'Battler' }
      ].forEach(role => {
        const button = document.createElement('button');

        button.type = 'button';
        button.className = 'season-record-tab';
        button.textContent = role.label;
        button.dataset.role = role.id;

        button.setAttribute('role', 'tab');
        button.setAttribute(
          'aria-selected',
          String(activeRole === role.id)
        );

        if (activeRole === role.id) {
          button.classList.add('active');
        }

        button.addEventListener('click', () => {
          if (activeRole === role.id) return;

          activeRole = role.id;
          renderTables();
        });

        tabs.appendChild(button);
      });

      container.appendChild(tabs);
    }

    /* =========================================================
       PLAYOFF BRACKET
       ========================================================= */

    /*
      Backend row format (L:U):

      0  ROUND
      1  PLAYER 1
      2  PSEUDONYM 1
      3  RESULT 1
      4  SCORE 1
      5  VS.
      6  SCORE 2
      7  RESULT 2
      8  PSEUDONYM 2
      9  PLAYER 2

      The renderer groups matches using the ROUND value.
      It does not assume that a particular player won.
    */

    function normaliseRound(value) {
      return String(value || '')
        .toLowerCase()
        .replace(/[^a-z0-9]/g, '');
    }

    function roundType(value) {
      const round = normaliseRound(value);

      if (
        round === 'quarters' ||
        round === 'quarter' ||
        round === 'quarterfinal' ||
        round === 'quarterfinals' ||
        round === 'qf'
      ) {
        return 'quarters';
      }

      if (
        round === 'semi' ||
        round === 'semis' ||
        round === 'semifinal' ||
        round === 'semifinals' ||
        round === 'sf'
      ) {
        return 'semis';
      }

      if (
        round === 'final' ||
        round === 'finals'
      ) {
        return 'final';
      }

      return 'other';
    }

    function makePlayerCard(name, pseudonym, score, result) {
      const card = document.createElement('div');
      card.className = 'season-bracket-player';

      const details = document.createElement('div');
      details.className = 'season-bracket-player-details';

      const playerName = document.createElement('div');
      playerName.className = 'season-bracket-player-name';

      if (String(name || '').trim()) {
        const link = DBA.playerLink(String(name).trim());

        if (link) {
          playerName.appendChild(link);
        } else {
          playerName.textContent = name;
        }
      } else {
        playerName.textContent = 'TBD';
        card.classList.add('is-tbd');
      }

      details.appendChild(playerName);

      if (String(pseudonym || '').trim()) {
        const alias = document.createElement('div');

        alias.className = 'season-bracket-pseudonym';
        alias.textContent = pseudonym;

        details.appendChild(alias);
      }

      card.appendChild(details);

      const meta = document.createElement('div');
      meta.className = 'season-bracket-player-meta';

      if (String(score == null ? '' : score).trim() !== '') {
        const scoreEl = document.createElement('span');

        scoreEl.className = 'season-bracket-score';
        scoreEl.textContent = String(score);

        meta.appendChild(scoreEl);
      }

      if (String(result || '').trim()) {
        const resultEl = document.createElement('span');

        resultEl.className = 'season-bracket-result';
        resultEl.textContent = result;

        const resultKey = String(result).trim().toLowerCase();

        if (
          ['w', 'win', 'won', 'winner', 'advanced'].includes(resultKey)
        ) {
          resultEl.classList.add('is-winner');
        } else if (
          ['l', 'loss', 'lost', 'loser', 'eliminated'].includes(resultKey)
        ) {
          resultEl.classList.add('is-loser');
        }

        meta.appendChild(resultEl);
      }

      if (meta.childNodes.length) {
        card.appendChild(meta);
      }

      return card;
    }

    function makeMatch(row) {
      const match = document.createElement('article');
      match.className = 'season-bracket-match';

      const player1 = makePlayerCard(
        row[1],
        row[2],
        row[4],
        row[3]
      );

      const player2 = makePlayerCard(
        row[9],
        row[8],
        row[6],
        row[7]
      );

      match.appendChild(player1);

      const versus = document.createElement('div');
      versus.className = 'season-bracket-versus';
      versus.textContent = 'VS';

      match.appendChild(versus);
      match.appendChild(player2);

      return match;
    }

    function makeBracketColumn(title, rows, emptyText) {
      const column = document.createElement('div');

      column.className = 'season-bracket-round';

      const heading = document.createElement('h4');
      heading.className = 'season-bracket-round-title';
      heading.textContent = title;

      column.appendChild(heading);

      const matches = document.createElement('div');
      matches.className = 'season-bracket-matches';

      if (rows.length) {
        rows.forEach(row => {
          matches.appendChild(makeMatch(row));
        });
      } else {
        const empty = document.createElement('p');

        empty.className = 'season-bracket-empty';
        empty.textContent = emptyText;

        matches.appendChild(empty);
      }

      column.appendChild(matches);

      return column;
    }

    function renderBracket(rows) {
      const bracket = document.createElement('div');
      bracket.className = 'season-bracket';

      const groups = {
        quarters: [],
        semis: [],
        final: [],
        other: []
      };

      rows.forEach(row => {
        const type = roundType(row[0]);

        groups[type].push(row);
      });

      bracket.appendChild(
        makeBracketColumn(
          'Quarter-finals',
          groups.quarters,
          'No quarter-final matches recorded.'
        )
      );

      bracket.appendChild(
        makeBracketColumn(
          'Semi-finals',
          groups.semis,
          'No semi-final matches recorded.'
        )
      );

      bracket.appendChild(
        makeBracketColumn(
          'Final',
          groups.final,
          'No final recorded.'
        )
      );

      if (groups.other.length) {
        const otherSection = document.createElement('section');

        otherSection.className = 'season-bracket-other';

        const heading = document.createElement('h4');
        heading.textContent = 'Other matches';

        otherSection.appendChild(heading);

        const matches = document.createElement('div');
        matches.className = 'season-bracket-other-matches';

        groups.other.forEach(row => {
          const wrapper = document.createElement('div');
          wrapper.className = 'season-bracket-other-match';

          const round = document.createElement('div');
          round.className = 'season-bracket-other-round';
          round.textContent = row[0] || 'Match';

          wrapper.appendChild(round);
          wrapper.appendChild(makeMatch(row));
          matches.appendChild(wrapper);
        });

        otherSection.appendChild(matches);
        bracket.appendChild(otherSection);
      }

      return bracket;
    }

    /* =========================================================
       RENDER THE PAGE
       ========================================================= */

    function renderTables() {
      if (!currentData) return;

      root.replaceChildren();

      // Main Season.
      const mainSection = document.createElement('section');
      mainSection.className = 'season-record-section';

      const mainHeading = document.createElement('h3');
      mainHeading.textContent = 'Main Season';

      mainSection.appendChild(mainHeading);
      renderRoleTabs(mainSection);

      const mainData = currentData[activeRole];

      const mainTable = makeTable(
        mainData.headers,
        mainData.rows,
        'season-main-table'
      );

      mainSection.appendChild(makeTableWrapper(mainTable));
      root.appendChild(mainSection);

      // Play Offs bracket.
      const playoffSection = document.createElement('section');
      playoffSection.className = 'season-record-section';

      const playoffHeading = document.createElement('h3');
      playoffHeading.textContent = 'Play Offs';

      playoffSection.appendChild(playoffHeading);

      const playoffRows =
        currentData.playoffs &&
        currentData.playoffs[activeRole]
          ? currentData.playoffs[activeRole]
          : [];

      if (playoffRows.length) {
        playoffSection.appendChild(renderBracket(playoffRows));
      } else {
        const empty = document.createElement('p');

        empty.className = 'season-record-empty';
        empty.textContent =
          'No Play Offs data available for ' +
          activeRole.charAt(0).toUpperCase() +
          activeRole.slice(1) + '.';

        playoffSection.appendChild(empty);
      }

      root.appendChild(playoffSection);
    }

    /* =========================================================
       LOAD SELECTED SEASON
       ========================================================= */

    async function loadSelected() {
      const selection = selectedOption();

      if (!selection) return;

      // Keep the URL in sync with both dropdowns.
      updateSeasonUrl(selection);

      const mine = ++requestToken;

      statusEl.textContent = 'Loading season records...';

      root.replaceChildren();
      currentData = null;

      try {
        const data = await DBA.call(
          'seasonRecordsGetData',
          selection.season,
          selection.division
        );

        if (mine !== requestToken) return;

        currentData = data;
        activeRole = 'coach';

        renderTables();

        statusEl.textContent = '';
      } catch (error) {
        if (mine !== requestToken) return;

        statusEl.textContent =
          'Error loading season records: ' + error.message;
      }
    }

    seasonSel.addEventListener('change', () => {
      populateDivisions();

      if (divisionSel.disabled || !divisionSel.value) {
        requestToken++;
        currentData = null;

        root.replaceChildren();

        statusEl.textContent =
          'No divisions available for this season.';

        return;
      }

      loadSelected();
    });

    divisionSel.addEventListener('change', loadSelected);

    /* =========================================================
       INITIALISE
       ========================================================= */

    async function initialise() {
      statusEl.textContent = 'Loading available seasons...';

      try {
        options = await DBA.call('seasonRecordsGetOptions');

        if (!options.length) {
          seasonSel.replaceChildren();
          divisionSel.replaceChildren();

          seasonSel.disabled = true;
          divisionSel.disabled = true;

          statusEl.textContent =
            'No season records were found in SeasonInput.';

          return;
        }

        populateSeasons();

        // If the URL contains a valid combined key, select both
        // the matching season and its division.
        const requestedOption = getRequestedSeasonOption();

        if (requestedOption) {
          seasonSel.value = requestedOption.season;
          populateDivisions(requestedOption.division);
        } else {
          populateDivisions();
        }

        seasonSel.disabled = false;

        // loadSelected() also writes the canonical combined key
        // into the URL, including when no valid key was supplied.
        await loadSelected();
      } catch (error) {
        statusEl.textContent =
          'Error loading seasons: ' + error.message;
      }
    }

    initialise();
  </script>

</body>
</html>
