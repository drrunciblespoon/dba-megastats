<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Season Records - DBA Megastats</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="layout.css">

  <script src="shared.js"></script>
  <script src="api.js"></script>
</head>

<body class="centered page-season-records">

  <h2>Season Records</h2>

  <div class="controls season-record-controls">
    <div>
      <label for="seasonSel">Season</label>
      <select id="seasonSel" disabled>
        <option>Loading...</option>
      </select>
    </div>

    <div>
      <label for="divisionSel">Division</label>
      <select id="divisionSel" disabled>
        <option>Select a season first</option>
      </select>
    </div>
  </div>

  <div id="status" role="status" aria-live="polite"></div>

  <div id="seasonRoot"></div>

  <script>
    const seasonSel = DBA.$('seasonSel');
    const divisionSel = DBA.$('divisionSel');
    const statusEl = DBA.$('status');
    const root = DBA.$('seasonRoot');

    let options = [];
    let currentData = null;
    let activeRole = 'coach';
    let requestToken = 0;

    function selectedOption() {
      return options.find(option =>
        option.season === seasonSel.value &&
        option.division === divisionSel.value
      );
    }

    function populateSeasons() {
      const seasons = [...new Set(
        options.map(option => option.season)
      )];

      seasonSel.replaceChildren();

      seasons.forEach(season => {
        const option = document.createElement('option');

        option.value = season;
        option.textContent =
          'Season ' + season.replace(/^Season\s*/i, '');

        seasonSel.appendChild(option);
      });
    }

    function populateDivisions(preferredDivision) {
      const season = seasonSel.value;

      const divisions = options.filter(option =>
        option.season === season
      );

      divisionSel.replaceChildren();

      divisions.forEach(item => {
        const option = document.createElement('option');

        option.value = item.division;
        option.textContent = item.division;

        divisionSel.appendChild(option);
      });

      if (
        preferredDivision &&
        divisions.some(item => item.division === preferredDivision)
      ) {
        divisionSel.value = preferredDivision;
      }

      divisionSel.disabled = divisions.length === 0;
    }


    /* =========================================================
       MAIN SEASON TABLE
       ========================================================= */

    function makeTable(headers, rows, className) {
      const table = document.createElement('table');

      table.className = className || '';
      table.dataset.seasonTable = 'true';

      const hasRank = className === 'season-main-table';

      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');

      if (hasRank) {
        const th = document.createElement('th');

        th.textContent = 'Rank';
        th.dataset.c = 'rank';
        th.scope = 'col';

        headerRow.appendChild(th);
      }

      headers.forEach((header, index) => {
        const th = document.createElement('th');

        th.textContent = header;
        th.dataset.c = index;
        th.scope = 'col';

        headerRow.appendChild(th);
      });

      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');

      rows.forEach((row, rowIndex) => {
        const tr = document.createElement('tr');

        if (hasRank) {
          const rankCell = document.createElement('td');

          rankCell.textContent = String(rowIndex + 1);
          rankCell.dataset.c = 'rank';
          rankCell.className = 'num';

          tr.appendChild(rankCell);
        }

        row.forEach((value, index) => {
          const td = document.createElement('td');
          const text = value == null ? '' : String(value);

          td.dataset.c = index;

          const isPlayerColumn = hasRank && index === 0;

          if (isPlayerColumn && text.trim()) {
            const link = DBA.playerLink(text);

            if (link) {
              td.appendChild(link);
            } else {
              td.textContent = text;
            }
          } else {
            td.textContent = text;
          }

          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      });

      if (!rows.length) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');

        td.colSpan = headers.length + (hasRank ? 1 : 0);
        td.className = 'season-record-empty';
        td.textContent = 'No records available.';

        tr.appendChild(td);
        tbody.appendChild(tr);
      }

      table.appendChild(tbody);

      return table;
    }

    function makeTableWrapper(table) {
      const wrapper = document.createElement('div');

      wrapper.className = 'season-record-table-wrap';
      wrapper.appendChild(table);

      return wrapper;
    }


    /* =========================================================
       COACH / BATTLER TABS
       ========================================================= */

    function renderRoleTabs(container) {
      const tabs = document.createElement('div');

      tabs.className = 'season-record-tabs';
      tabs.setAttribute('role', 'tablist');
      tabs.setAttribute('aria-label', 'Player class');

      [
        { id: 'coach', label: 'Coach' },
        { id: 'battler', label: 'Battler' }
      ].forEach(role => {
        const button = document.createElement('button');

        button.type = 'button';
        button.className = 'season-record-tab';
        button.textContent = role.label;
        button.dataset.role = role.id;

        button.setAttribute('role', 'tab');
        button.setAttribute(
          'aria-selected',
          String(activeRole === role.id)
        );

        if (activeRole === role.id) {
          button.classList.add('active');
        }

        button.addEventListener('click', () => {
          if (activeRole === role.id) return;

          activeRole = role.id;
          renderTables();
        });

        tabs.appendChild(button);
      });

      container.appendChild(tabs);
    }


    /* =========================================================
       PLAYOFF BRACKET
       ========================================================= */

    function normaliseRound(value) {
      return String(value || '')
        .toLowerCase()
        .replace(/[^a-z0-9]/g, '');
    }

    function roundType(value) {
      const round = normaliseRound(value);

      if (
        round === 'quarters' ||
        round === 'quarter' ||
        round === 'quarterfinal' ||
        round === 'quarterfinals' ||
        round === 'qf'
      ) {
        return 'quarters';
      }

      if (
        round === 'semi' ||
        round === 'semis' ||
        round === 'semifinal' ||
        round === 'semifinals' ||
        round === 'sf'
      ) {
        return 'semis';
      }

      if (
        round === 'final' ||
        round === 'finals'
      ) {
        return 'final';
      }

      return 'other';
    }

    /**
     * Renders one combined Coach / Battler entrant.
     */
    function makePlayerCard(
      coachName,
      coachPseudonym,
      battlerName,
      battlerPseudonym,
      score,
      result
    ) {
      const card = document.createElement('div');
      card.className = 'season-bracket-player';

      const details = document.createElement('div');
      details.className = 'season-bracket-player-details';

      const playerName = document.createElement('div');
      playerName.className = 'season-bracket-player-name';

      const coach = String(coachName || '').trim();
      const battler = String(battlerName || '').trim();

      const names = [
        coach || 'TBD',
        battler || 'TBD'
      ];

      names.forEach((name, index) => {
        if (index) {
          playerName.appendChild(
            document.createTextNode(' / ')
          );
        }

        if (name === 'TBD') {
          playerName.appendChild(
            document.createTextNode(name)
          );

          card.classList.add('is-tbd');
          return;
        }

        const link = DBA.playerLink(name);

        if (link) {
          playerName.appendChild(link);
        } else {
          playerName.appendChild(
            document.createTextNode(name)
          );
        }
      });

      details.appendChild(playerName);

      const aliases = [
        String(coachPseudonym || '').trim(),
        String(battlerPseudonym || '').trim()
      ];

      if (aliases.some(Boolean)) {
        const alias = document.createElement('div');

        alias.className = 'season-bracket-pseudonym';
        alias.textContent = aliases
          .map(value => value || '—')
          .join(' / ');

        details.appendChild(alias);
      }

      card.appendChild(details);

      const meta = document.createElement('div');
      meta.className = 'season-bracket-player-meta';

      if (String(score == null ? '' : score).trim() !== '') {
        const scoreEl = document.createElement('span');

        scoreEl.className = 'season-bracket-score';
        scoreEl.textContent = String(score);

        meta.appendChild(scoreEl);
      }

      if (String(result || '').trim()) {
        const resultEl = document.createElement('span');

        resultEl.className = 'season-bracket-result';
        resultEl.textContent = result;

        const resultKey = String(result)
          .trim()
          .toLowerCase();

        if (
          ['w', 'win', 'won', 'winner', 'advanced']
            .includes(resultKey)
        ) {
          resultEl.classList.add('is-winner');
        } else if (
          ['l', 'loss', 'lost', 'loser', 'eliminated']
            .includes(resultKey)
        ) {
          resultEl.classList.add('is-loser');
        }

        meta.appendChild(resultEl);
      }

      if (meta.childNodes.length) {
        card.appendChild(meta);
      }

      return card;
    }

    /**
     * Renders one match using the combined API response.
     */
    function makeMatch(match) {
      const article = document.createElement('article');
      article.className = 'season-bracket-match';

      const player1 = makePlayerCard(
        match.coach1,
        match.coachAlias1,
        match.battler1,
        match.battlerAlias1,
        match.score1,
        match.result1
      );

      const player2 = makePlayerCard(
        match.coach2,
        match.coachAlias2,
        match.battler2,
        match.battlerAlias2,
        match.score2,
        match.result2
      );

      article.appendChild(player1);

      const versus = document.createElement('div');
      versus.className = 'season-bracket
