<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Pokemon Records - DBA Megastats</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="layout.css">

  <script src="shared.js"></script>
  <script src="api.js"></script>
</head>

<body class="centered page-pokemon">

  <div class="controls">
    <div>
      <label for="sectionSel">Records</label>
      <select id="sectionSel" data-plain>
        <option>Loading...</option>
      </select>
    </div>
  </div>

  <div id="status"></div>

  <div id="root"></div>


  <script>

    const sel = DBA.$('sectionSel');
    const statusEl = DBA.$('status');
    const root = DBA.$('root');

    let sections = [];


    /*
     * ============================================================
     * Build one records table
     * ============================================================
     */

    function buildTable(t) {

      const box =
        document.createElement('div');

      box.style.marginBottom = '20px';


      /*
       * ----------------------------------------------------------
       * Table title
       * ----------------------------------------------------------
       */

      if (t.title) {

        const h =
          document.createElement('h3');

        h.textContent = t.title;

        box.appendChild(h);

      }


      /*
       * ----------------------------------------------------------
       * Table wrapper
       * ----------------------------------------------------------
       */

      const wrap =
        document.createElement('div');

      wrap.className = 'wrap';


      const table =
        document.createElement('table');


      /*
       * ----------------------------------------------------------
       * Determine numeric columns
       * ----------------------------------------------------------
       *
       * A column is right-aligned when every value in that
       * column is numeric.
       *
       * The sprite column is therefore never treated as numeric.
       */

      const isNum =
        t.headers.map(
          (h, i) =>
            i > 0 &&
            t.rows.length > 0 &&
            t.rows.every(
              r =>
                r[i] &&
                /^[+-]?[\d.,]+%?$/.test(
                  r[i].t || ''
                )
            )
        );


      /*
       * ----------------------------------------------------------
       * Table header
       * ----------------------------------------------------------
       */

      const head =
        table
          .createTHead()
          .insertRow();


      t.headers.forEach(
        (name, i) => {

          const th =
            document.createElement('th');

          th.textContent = name;

          if (isNum[i]) {
            th.className = 'num';
          }

          head.appendChild(th);

        }
      );


      /*
       * ----------------------------------------------------------
       * Table body
       * ----------------------------------------------------------
       */

      const body =
        table.createTBody();


      t.rows.forEach(r => {

        const tr =
          body.insertRow();


        r.forEach((c, i) => {

          const td =
            tr.insertCell();


          /*
           * ------------------------------------------------------
           * Sprite
           * ------------------------------------------------------
           */

          if (c.img) {

           
if (c.img) {
  const im = document.createElement('img');
  const pokemonName = r[1] ? r[1].t : '';

  im.src = DBA.spriteUrl(pokemonName, c.img);
  im.alt = pokemonName;
  im.loading = 'lazy';
  td.appendChild(im);
}



          /*
           * ------------------------------------------------------
           * Pokémon / ordinary text
           * ------------------------------------------------------
           */

          else {

            const isPokemonColumn =
  String(t.headers[i])
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .trim()
    .toLowerCase() === 'pokemon';


            if (isPokemonColumn && c.t) {

              const link =
                DBA.pokemonLink(c.t);


              if (link) {

                td.appendChild(link);

              } else {

                td.textContent = c.t;

              }

            } else {

              td.textContent = c.t;
              if (c.color) {
  td.style.color = c.color;
  td.style.fontWeight = 'bold';
}

            }

          }


          /*
           * ------------------------------------------------------
           * Numeric alignment
           * ------------------------------------------------------
           */

          if (isNum[i]) {
            td.className = 'num';
          }

        });

      });


      wrap.appendChild(table);

      box.appendChild(wrap);

      return box;

    }

    
    /*
     * ============================================================
     * Price Movers
     * ============================================================
     */

    let pokemonLookupPromise = null;

    function getPokemonLookupData() {
      if (!pokemonLookupPromise) {
        pokemonLookupPromise = DBA.call('pokemonLookupGetAll');
      }

      return pokemonLookupPromise;
    }

    function getEligiblePrices(pokemon, type) {
      const costs = Array.isArray(pokemon.seasonCosts)
        ? [...pokemon.seasonCosts].sort(
            (a, b) => a.season - b.season
          )
        : [];

      return costs.flatMap(entry => {
        const regularCost = entry.cost;

        // A banned regular price is not a valid price.
        if (
          entry.banned ||
          typeof regularCost !== 'number' ||
          regularCost === 99
        ) {
          return [];
        }

        if (type === 'regular') {
          return [{
            season: entry.season,
            cost: regularCost
          }];
        }

        // Tera prices do not exist in Seasons 1–2.
        if (entry.season <= 2) {
          return [];
        }

        // Exclude Tera-banned and Tera-incompatible entries.
        if (entry.teraBanned || entry.teraIncompatible) {
          return [];
        }

        // No Tera tax means the regular cost applies.
        if (!entry.hasTeraTax) {
          return [{
            season: entry.season,
            cost: regularCost
          }];
        }

        // Otherwise, use the calculated Tera cost.
        if (typeof entry.teraCost === 'number') {
          return [{
            season: entry.season,
            cost: entry.teraCost
          }];
        }

        return [];
      });
    }

    function buildMoversTable(pokemonList, type) {
      const movers = pokemonList.flatMap(pokemon => {
        const prices = getEligiblePrices(pokemon, type);

        // At least two valid prices are needed for a comparison.
        if (prices.length < 2) {
          return [];
        }

        const first = prices[0];
        const latest = prices[prices.length - 1];
        const netChange = latest.cost - first.cost;

        return [{
  name: pokemon.name,
  sprite: pokemon.sprite,
  first,
  latest,
  netChange,
  absoluteChange: Math.abs(netChange)
}];
      });

      movers.sort((a, b) =>
        b.absoluteChange - a.absoluteChange ||
        a.name.localeCompare(b.name)
      );

      const topTen = movers.slice(0, 10);

      return {
        title: type === 'regular'
          ? 'Top 10 Price Shifts'
          : 'Top 10 Tera Shifts',

       headers: [
  'Sprite',
  'Pokémon',
  'First Season',
  'First Cost',
  'Latest Season',
  'Latest Cost',
  'Net Change'
],

        rows: topTen.length
          ? topTen.map(pokemon => [
  { img: pokemon.sprite || '' },
  { t: pokemon.name },
  { t: String(pokemon.first.season) },
  { t: String(pokemon.first.cost) },
  { t: String(pokemon.latest.season) },
  { t: String(pokemon.latest.cost) },
 {
  t: pokemon.netChange > 0
    ? `↑ +${pokemon.netChange}`
    : pokemon.netChange < 0
      ? `↓ ${pokemon.netChange}`
      : '–',
  color: pokemon.netChange > 0
    ? 'green'
    : pokemon.netChange < 0
      ? 'red'
      : ''
}
])
          : [[
              { t: 'No eligible price histories found.' },
              { t: '' },
              { t: '' },
              { t: '' },
              { t: '' },
              { t: '' }
            ]]
      };
    }

    function showMovers(type, sectionIndex) {
      root.innerHTML = '';
      statusEl.textContent = 'Loading price data...';

      getPokemonLookupData()
        .then(data => {
          // Ignore results if the user has selected another section.
          if (Number(sel.value) !== sectionIndex) {
            return;
          }

          const pokemonList =
            data && Array.isArray(data.pokemon)
              ? data.pokemon
              : [];

          const table = buildMoversTable(pokemonList, type);

          const flex = document.createElement('div');
          flex.style.cssText =
            'display:flex;' +
            'flex-wrap:wrap;' +
            'gap:8px 32px;' +
            'align-items:flex-start;' +
            'margin-top:16px';

          const col = document.createElement('div');
          col.appendChild(buildTable(table));
          flex.appendChild(col);
          root.appendChild(flex);

          statusEl.textContent = '';
        })
        .catch(error => {
          if (Number(sel.value) !== sectionIndex) {
            return;
          }

          statusEl.textContent =
            'Error loading price movers: ' + error.message;
        });
    }



    /*
     * ============================================================
     * Display selected section
     * ============================================================
     */

   
function show(i) {
  root.innerHTML = '';

  const section = sections[i];

  if (section.moverType) {
    showMovers(section.moverType, i);
    return;
  }



      const flex =
        document.createElement('div');

      flex.style.cssText =
        'display:flex;' +
        'flex-wrap:wrap;' +
        'gap:8px 32px;' +
        'align-items:flex-start;' +
        'margin-top:16px';


      sections[i].groups.forEach(group => {

        const col =
          document.createElement('div');


        group.forEach(t => {

          col.appendChild(
            buildTable(t)
          );

        });


        flex.appendChild(col);

      });


      root.appendChild(flex);

    }


    /*
     * ============================================================
     * Load Pokémon records
     * ============================================================
     */

    DBA.call('prGetAll')

      .then(data => {

        sections = [...data];

// Add the two calculated views to the existing Records dropdown.
sections.push({
  title: 'BIGGEST PRICE SHIFTS',
  moverType: 'regular'
});

sections.push({
  title: 'BIGGEST TERA PRICE SHIFTS',
  moverType: 'tera'
});


        /*
         * --------------------------------------------------------
         * Fill section selector
         * --------------------------------------------------------
         */

        sel.innerHTML = '';


        sections.forEach(
          (s, i) => {

            const o =
              document.createElement('option');

            o.value = i;

            o.textContent =
              s.title;

            sel.appendChild(o);

          }
        );


        statusEl.textContent = '';


        /*
         * --------------------------------------------------------
         * Show first section
         * --------------------------------------------------------
         */

        if (sections.length) {
          show(0);
        }

      })


      .catch(e => {

        statusEl.textContent =
          'Error: ' + e.message;

      });


    /*
     * ============================================================
     * Section changed
     * ============================================================
     */

    sel.addEventListener(
      'change',
      () => {

        show(
          Number(sel.value)
        );

      }
    );

  </script>

</body>
</html>
