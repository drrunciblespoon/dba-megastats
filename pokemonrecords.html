<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokemon Records - DBA Megastats</title>
  <link rel="stylesheet" href="styles.css">
  <script src="shared.js"></script>
  <script src="api.js"></script>
</head>
<body class="centered">
  <div class="controls">
    <div>
      <label for="sectionSel">Records</label>
      <select id="sectionSel"><option>Loading...</option></select>
    </div>
  </div>
  <div id="status">Loading...</div>
  <div id="root"></div>

  <script>
    const sel = DBA.$('sectionSel');
    const statusEl = DBA.$('status');
    const root = DBA.$('root');
    let sections = [];

    function buildTable(t) {
      const box = document.createElement('div');
      box.style.marginBottom = '20px';
      if (t.title) {
        const h = document.createElement('h3');
        h.textContent = t.title;
        box.appendChild(h);
      }
      const wrap = document.createElement('div');
      wrap.className = 'wrap';
      const table = document.createElement('table');

      // A column is right-aligned if every value in it is a number (the sprite column never is)
      const isNum = t.headers.map((h, i) =>
        i > 0 && t.rows.length > 0 && t.rows.every(r => r[i] && /^-?[\d.,]+%?$/.test(r[i].t || '')));

      const head = table.createTHead().insertRow();
      t.headers.forEach((name, i) => {
        const th = document.createElement('th');
        th.textContent = name;
        if (isNum[i]) th.className = 'num';
        head.appendChild(th);
      });

      const body = table.createTBody();
      t.rows.forEach(r => {
        const tr = body.insertRow();
        r.forEach((c, i) => {
          const td = tr.insertCell();
          if (c.img) {
            const im = document.createElement('img');
            im.src = c.img;
            im.alt = r[1] ? r[1].t : '';
            im.loading = 'lazy';
            td.appendChild(im);
          } else {
            td.textContent = c.t;
            if (isNum[i]) td.className = 'num';
          }
        });
      });
      wrap.appendChild(table);
      box.appendChild(wrap);
      return box;
    }

    function show(i) {
      root.innerHTML = '';
      const flex = document.createElement('div');
      flex.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px 32px;align-items:flex-start;margin-top:16px';
      sections[i].groups.forEach(group => {
        const col = document.createElement('div');
        group.forEach(t => col.appendChild(buildTable(t)));
        flex.appendChild(col);
      });
      root.appendChild(flex);
    }

    DBA.call('prGetAll')
      .then(data => {
        sections = data;
        sel.innerHTML = '';
        sections.forEach((s, i) => {
          const o = document.createElement('option');
          o.value = i;
          o.textContent = s.title;
          sel.appendChild(o);
        });
        statusEl.textContent = '';
        if (sections.length) show(0);
      })
      .catch(e => { statusEl.textContent = 'Error: ' + e.message; });

    sel.addEventListener('change', () => show(Number(sel.value)));
  </script>
</body>
</html>
