<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Gen 9 Stats - DBA Megastats</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <link
    rel="stylesheet"
    href="layout.css"
  >

  <script src="shared.js"></script>
  <script src="api.js"></script>

</head>


<body class="centered page-stats">


  <!-- =========================================================
       Table selector
       ========================================================= -->

  <div class="controls">

    <div>

      <label for="tableSel">
        Table
      </label>

      <select id="tableSel">
        <option>
          Loading...
        </option>
      </select>

    </div>

  </div>


  <!-- =========================================================
       Status
       ========================================================= -->

  <div id="status"></div>


  <!-- =========================================================
       Page information
       ========================================================= -->

  <p class="page-note">

    Tables are sorted by Wins by default.
    Click any column heading to sort by that column.

  </p>


  <!-- =========================================================
       Generated table
       ========================================================= -->

  <div id="root"></div>


  <script>


    /*
     * ------------------------------------------------------------
     * Elements
     * ------------------------------------------------------------
     */

    const sel =
      DBA.$('tableSel');

    const statusEl =
      DBA.$('status');

    const root =
      DBA.$('root');


    let token = 0;


    /*
     * ------------------------------------------------------------
     * Load table titles
     * ------------------------------------------------------------
     */

    DBA.call('mpGetTableTitles')

      .then(titles => {

        sel.innerHTML = '';


        titles.forEach((t, i) => {

          const option =
            document.createElement('option');

          option.value =
            i;

          option.textContent =
            t;

          sel.appendChild(option);

        });


        /*
         * Load the first table automatically.
         */

        load(0);

      })


      .catch(error => {

        statusEl.textContent =
          'Error: ' + error.message;

      });


    /*
     * ------------------------------------------------------------
     * Table selection
     * ------------------------------------------------------------
     */

    sel.addEventListener(
      'change',
      () => load(Number(sel.value))
    );


    /*
     * ------------------------------------------------------------
     * Load selected table
     * ------------------------------------------------------------
     */

    function load(index) {

      const mine =
        ++token;


      statusEl.textContent =
        'Loading...';


      root.innerHTML =
        '';


      DBA.call(
        'mpGetTable',
        index
      )

        .then(table => {

          /*
           * Ignore the response if the user has already
           * selected another table.
           */

          if (mine !== token) {
            return;
          }


          statusEl.textContent =
            '';


          /*
           * DBA.sortableTable() creates the actual table.
           */

          const generatedTable =
            DBA.sortableTable(table);


          root.appendChild(
            generatedTable
          );

        })


        .catch(error => {

          if (mine === token) {

            statusEl.textContent =
              'Error: ' + error.message;

          }

        });

    }


  </script>

</body>

</html>
