<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Gen 9 Stats - DBA Megastats</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <link
    rel="stylesheet"
    href="layout.css"
  >

  <script src="shared.js"></script>
  <script src="api.js"></script>

</head>


<body class="centered page-stats">


  <!-- =========================================================
       Table selector
       ========================================================= -->

  <div class="controls">

    <div>

      <label for="tableSel">
        Table
      </label>

      <select id="tableSel" data-plain>
        <option>
          Loading...
        </option>
      </select>

    </div>

  </div>


  <!-- =========================================================
       Status
       ========================================================= -->

  <div id="status"></div>


  <!-- =========================================================
       Page information
       ========================================================= -->

  <p class="page-note">

    Tables are sorted by Wins by default.
    Click any column heading to sort by that column.

  </p>


  <!-- =========================================================
       Generated table
       ========================================================= -->

  <div id="root"></div>


  <script>


    /*
     * ------------------------------------------------------------
     * Elements
     * ------------------------------------------------------------
     */

    const sel =
      DBA.$('tableSel');

    const statusEl =
      DBA.$('status');

    const root =
      DBA.$('root');


    let token = 0;


    /*
     * ------------------------------------------------------------
     * Make Pokémon cells into links
     * ------------------------------------------------------------
     *
     * DBA.sortableTable() expects text objects in its rows.
     *
     * Rather than creating links after the table has been drawn,
     * we mark Pokémon cells as links here and let the table
     * renderer create the actual <a> element.
     *
     * The URL itself is always generated by DBA.pokemonUrl().
     * ------------------------------------------------------------
     */

    function preparePokemonLinks(table) {

      const pokemonColumn =
        table.headers.findIndex(
          header =>
            String(header)
              .trim()
              .toLowerCase() === 'pokemon'
        );


      if (pokemonColumn === -1) {
        return table;
      }


      table.rows =
        table.rows.map(row => {

          const cell =
            row[pokemonColumn];


          if (
            !cell ||
            !cell.t ||
            cell.t === '–'
          ) {
            return row;
          }


          const pokemonName =
            String(cell.t).trim();


          if (!pokemonName) {
            return row;
          }


          /*
           * Preserve the original cell data while adding
           * the canonical Pokémon URL.
           */

          row[pokemonColumn] = {
            ...cell,
            pokemonLink:
              DBA.pokemonUrl(pokemonName)
          };


          return row;

        });


      return table;

    }


    /*
     * ------------------------------------------------------------
     * Load table titles
     * ------------------------------------------------------------
     */

    DBA.call('mpGetTableTitles')

      .then(titles => {

        sel.innerHTML = '';


        titles.forEach((t, i) => {

          const option =
            document.createElement('option');

          option.value =
            i;

          option.textContent =
            t;

          sel.appendChild(option);

        });


        /*
         * Load the first table automatically.
         */

        if (titles.length) {
          load(0);
        }

      })


      .catch(error => {

        statusEl.textContent =
          'Error: ' + error.message;

      });


    /*
     * ------------------------------------------------------------
     * Table selection
     * ------------------------------------------------------------
     */

    sel.addEventListener(
      'change',
      () => load(Number(sel.value))
    );


    /*
     * ------------------------------------------------------------
     * Load selected table
     * ------------------------------------------------------------
     */

    function load(index) {

      const mine =
        ++token;


      statusEl.textContent =
        'Loading...';


      root.innerHTML =
        '';


      DBA.call(
        'mpGetTable',
        index
      )

        .then(table => {

          /*
           * Ignore the response if the user has already
           * selected another table.
           */

          if (mine !== token) {
            return;
          }


          statusEl.textContent =
            '';


          /*
           * Prepare Pokémon cells before handing the table
           * to the shared sortable-table renderer.
           */

          const preparedTable =
            preparePokemonLinks(table);


          /*
           * Build the searchable / sortable table.
           */

          const generatedTable =
            DBA.sortableTable(
              preparedTable
            );


          root.appendChild(
            generatedTable
          );

        })


        .catch(error => {

          if (mine === token) {

            statusEl.textContent =
              'Error: ' + error.message;

          }

        });

    }


  </script>

</body>

</html>
