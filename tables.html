<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gen 9 Stats - DBA Megastats</title>
  <link rel="stylesheet" href="styles.css">
  <script src="shared.js"></script>
  <script src="api.js"></script>
</head>
<body>
  <div class="controls">
    <div>
      <label for="tableSel">Table</label>
      <select id="tableSel"><option>Loading...</option></select>
    </div>
  </div>
  <div id="status"></div>
  <div id="root"></div>

  <script>
    const sel = DBA.$('tableSel');
    const statusEl = DBA.$('status');
    const root = DBA.$('root');
    let token = 0;

    DBA.call('mpGetTableTitles')
      .then(titles => {
        sel.innerHTML = '';
        titles.forEach((t, i) => {
          const o = document.createElement('option');
          o.value = i;
          o.textContent = t;
          sel.appendChild(o);
        });
        load(0);
      })
      .catch(e => { statusEl.textContent = 'Error: ' + e.message; });

    sel.addEventListener('change', () => load(Number(sel.value)));

    function load(i) {
      const mine = ++token;
      statusEl.textContent = 'Loading...';
      root.innerHTML = '';
      DBA.call('mpGetTable', i)
        .then(t => {
          if (mine !== token) return;   // the user has already switched table
          statusEl.textContent = '';
          root.appendChild(DBA.sortableTable(t));
        })
        .catch(e => { if (mine === token) statusEl.textContent = 'Error: ' + e.message; });
    }
  </script>
</body>
</html>
